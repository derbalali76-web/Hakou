<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1428">
<title>حسابي — ذهب برو</title>
<link rel="manifest" href="portal.webmanifest">
<link rel="icon" href="portal-192.png">
<link rel="apple-touch-icon" href="portal-apple.png">
<style>
:root{--navy:#0e1428;--navy2:#18203c;--gold:#efb52f;--gold-deep:#b9820a;--ink:#1a2036;--muted:#8b92a9;--bg:#f3f4fb;--card:#fff;--line:#e8eaf2;--green:#12a866;--red:#e33f57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;min-height:100vh}
.top{background:linear-gradient(135deg,#0e1428,#243158);color:#fff;padding:22px 16px 70px;text-align:center}
.top .shop{font-weight:900;font-size:19px;color:var(--gold)}
.top .who{font-weight:700;font-size:14px;margin-top:4px;opacity:.9}
.wrap{max-width:560px;margin:-52px auto 30px;padding:0 14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 22px -8px rgba(14,20,40,.14);margin-bottom:14px}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bal>div{text-align:center;padding:10px 4px}
.bal .l{font-size:12px;color:var(--muted);font-weight:800}
.bal .v{font-size:23px;font-weight:900;margin-top:4px;direction:ltr}
.bal .s{font-size:12px;font-weight:800;margin-top:2px}
.pos{color:var(--red)}.neg{color:var(--green)}.zero{color:var(--muted)}
h3{margin:4px 4px 12px;font-size:15px}
.it{border-bottom:1px solid var(--line);padding:12px 2px}
.it:last-child{border:0}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;background:#eef2ff;color:#3a4fd0}
.badge.b{background:#fdf4d6;color:var(--gold-deep)}.badge.p{background:#e0f5ea;color:var(--green)}.badge.t{background:#fde8eb;color:var(--red)}
.dt{margin-inline-start:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.r2{font-weight:800;font-size:14.5px;margin-top:7px}
.r3{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px;line-height:1.8}
.it.tap{cursor:pointer;padding:13px 4px;display:flex;align-items:center;gap:10px}
.it.tap:active{background:#f6f7fc}
.it .mn{flex:1;min-width:0}
.it .t1{font-weight:900;font-size:14.5px}
.it .t2{white-space:nowrap;font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.it .am{text-align:left;direction:ltr;font-weight:900;font-size:15px;white-space:nowrap}
.it .ch{color:#c3c8d9;font-size:18px;font-weight:900}
.sh-bg{position:fixed;inset:0;background:rgba(14,20,40,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.inv-h{text-align:center;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
.inv-h .n{font-weight:900;font-size:18px}.inv-h .d{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.tb{width:100%;border-collapse:collapse;font-size:12.5px;font-weight:700}
.tb th{font-size:10.5px;color:var(--muted);font-weight:800;padding:6px 3px;border-bottom:1px solid var(--line);text-align:center}
.tb td{padding:8px 3px;border-bottom:1px solid var(--line);text-align:center;direction:ltr}
.tot{background:#f6f7fc;border-radius:14px;padding:12px 14px;margin-top:12px}
.tot div{display:flex;justify-content:space-between;font-weight:800;font-size:13px;padding:3px 0}
.tot .big{font-size:17px;font-weight:900;border-top:1px solid var(--line);margin-top:5px;padding-top:8px}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:24px 0}
.login{max-width:380px;margin:60px auto;padding:0 18px}
input{width:100%;padding:13px;border-radius:12px;border:1.5px solid #e1e4ef;font-size:15px;direction:ltr;margin-bottom:10px;font-family:inherit}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:13px;background:linear-gradient(135deg,#141c38,#243158);color:#fff;font-weight:800;font-size:16px;border:0}
.out{background:none;border:0;color:var(--muted);font-weight:700;font-size:12.5px;display:block;margin:6px auto}
#err{color:var(--red);font-weight:800;font-size:12.5px;min-height:18px;margin-bottom:8px}
.upd{text-align:center;color:var(--muted);font-size:11.5px;font-weight:700;margin-top:6px}
</style>
</head>
<body>
<div id="app"><div class="top"><div class="shop">ذهب برو</div><div class="who">حسابي</div></div>
<div class="login" style="margin-top:-40px"><div class="card">
<input placeholder="رقم الهاتف" disabled><input type="password" placeholder="كلمة السر" disabled>
<div id="err">… جارٍ الاتصال</div><button class="btn" disabled style="opacity:.6">دخول</button></div></div></div>
<script>/* من سجّل دخوله سابقاً يرى «جارٍ التحميل» بدل نموذج الدخول */
try{if(localStorage.getItem('gp_portal_in')==='1')document.getElementById('app').innerHTML='<div class="top"><div class="shop">ذهب برو</div><div class="who">حسابي</div></div><div class="login" style="margin-top:-40px"><div class="card"><div class="empty">… جارٍ التحميل</div></div></div>';}catch(e){}</script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
'use strict';
const $app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grp=(n,d)=>{const x=Math.abs(+n||0).toFixed(d).split('.');x[0]=x[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');if(x[1])x[1]=x[1].replace(/0+$/,'');return x[0]+(x[1]?'.'+x[1]:'');};
const D=n=>'⁦'+grp(n,0)+'⁩',G=n=>'⁦'+grp(n,2)+'⁩';
const dt=ms=>{try{const x=new Date(ms),z=n=>String(n).padStart(2,'0');return z(x.getDate())+'/'+z(x.getMonth()+1)+'/'+x.getFullYear()}catch(e){return ''}};
const MAIL='@gp730.app';
const AR={'auth/invalid-credential':'رقم الهاتف أو كلمة السر خاطئة','auth/invalid-login-credentials':'رقم الهاتف أو كلمة السر خاطئة','auth/user-not-found':'رقم الهاتف غير مسجّل','auth/wrong-password':'كلمة السر خاطئة','auth/invalid-email':'رقم الهاتف غير صحيح','auth/network-request-failed':'لا يوجد اتصال بالإنترنت','auth/too-many-requests':'محاولات كثيرة — انتظر قليلاً'};
const netFail=()=>{$app.innerHTML='<div class="top"><div class="shop">ذهب برو</div><div class="who">حسابي</div></div><div class="login" style="margin-top:-40px"><div class="card"><div class="empty">تعذّر الاتصال — تأكّد من الإنترنت</div><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div></div>';};
const hint=v=>{try{v?localStorage.setItem('gp_portal_in','1'):localStorage.removeItem('gp_portal_in');}catch(e){}};
if(typeof firebase==='undefined'||!firebase.initializeApp){
  netFail();
}else if(!window.GP_FIREBASE||!GP_FIREBASE.apiKey||/YOUR_|ضع_/i.test(GP_FIREBASE.apiKey)){
  $app.innerHTML='<div class="login"><div class="empty">الخدمة غير مهيّأة بعد.</div></div>';
}else{
  firebase.initializeApp(GP_FIREBASE);
  const auth=firebase.auth(),db=firebase.database();
  let off=null;
  const side=(v,unit,fmt)=>{const a=Math.abs(v),z=unit==='d'?a<0.5:a<0.005;
    if(z)return ['zero','خالص ✓',fmt(0)];return v>0?['pos','عليك',fmt(a)]:['neg','لك عند المحل',fmt(a)];};
  function normU(raw){raw=String(raw||'').trim().toLowerCase();if(/[a-z]/.test(raw))return raw;
    let d=raw.replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');
    if(d.startsWith('00213'))d='0'+d.slice(5);else if(d.startsWith('213')&&d.length>=12)d='0'+d.slice(3);return d;}
  function loginView(msg){
    $app.innerHTML=`<div class="top"><div class="shop">ذهب برو</div><div class="who">حسابي</div></div>
    <div class="login" style="margin-top:-40px"><div class="card">
      <input id="u" placeholder="رقم الهاتف" inputmode="tel" autocomplete="username" autocapitalize="none" spellcheck="false">
      <input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password">
      <div id="err">${esc(msg||'')}</div>
      <button class="btn" id="go">دخول</button></div></div>`;
    const go=async()=>{const u=normU(document.getElementById('u').value),p=document.getElementById('p').value;
      if(!u||!p)return document.getElementById('err').textContent='أدخل رقم الهاتف وكلمة السر';
      document.getElementById('err').textContent='… جارٍ الدخول';
      try{await auth.signInWithEmailAndPassword(u+MAIL,p);}catch(e){document.getElementById('err').textContent=AR[e.code]||('خطأ: '+e.message);}};
    document.getElementById('go').onclick=go;document.getElementById('p').onkeydown=e=>{if(e.key==='Enter')go();};
  }
  window.closeSh=()=>{const x=document.getElementById('shbg');if(x)x.remove();};
  window.showInv=i=>{const e=(window.EVS||[])[i];if(!e||e.k!=='inv')return;const buy=e.type==='buy';
    const rows=(e.rows||[]),has=rows.some(r=>r[3]);
    const tw=rows.reduce((s,r)=>s+(+r[0]||0),0);
    const tr=rows.map((r,n)=>`<tr><td>${n+1}</td><td>${G(r[0])}</td><td>${esc(r[1])}</td><td>${G(r[2])}</td>${has?`<td>${D(r[3])}</td><td>${D(r[4])}</td>`:''}</tr>`).join('');
    const bg=document.createElement('div');bg.className='sh-bg';bg.id='shbg';bg.onclick=ev=>{if(ev.target===bg)closeSh();};
    bg.innerHTML=`<div class="sh"><div class="inv-h"><div class="n">فاتورة N°${esc(e.no)}</div><div class="d"><span dir="ltr">${dt(e.d)}</span> · ${buy?'بعتَ للمحل':'اشتريتَ من المحل'} · ${e.settled?'✓ خالصة':'غير خالصة'}</div></div>
      <div style="overflow-x:auto"><table class="tb"><tr><th>#</th><th>الوزن غ</th><th>العيار</th><th>ما يعادل 730</th>${has?'<th>سعر الغرام</th><th>المبلغ دج</th>':''}</tr>${tr}</table></div>
      <div class="tot"><div><span>عدد القطع</span><span>${rows.length}</span></div><div><span>الوزن الإجمالي</span><span dir="ltr">${G(tw)} غ</span></div><div><span>المعادل 730</span><span dir="ltr">${G(e.g)} غ</span></div><div class="big"><span>المبلغ</span><span dir="ltr">${D(e.money)} دج</span></div></div>
      <button class="btn" style="margin-top:14px" onclick="closeSh()">إغلاق</button></div>`;
    document.body.appendChild(bg);};
  function passView(){
    const inp=(id,ph,ac)=>`<input id="${id}" type="password" autocomplete="${ac}" placeholder="${ph}" style="margin-bottom:10px">`;
    const bg=document.createElement('div');bg.className='sh-bg';bg.id='shbg';bg.dataset.keep='1';bg.onclick=ev=>{if(ev.target===bg)closeSh();};
    bg.innerHTML=`<div class="sh"><div class="inv-h"><div class="n">تغيير كلمة السر</div></div>
      ${inp('pw-cur','كلمة السر الحالية','current-password')}${inp('pw-new','الجديدة (6 أحرف على الأقل)','new-password')}${inp('pw-new2','أعد كتابة الجديدة','new-password')}
      <div id="pw-err" style="color:#e33f57;font-weight:800;font-size:12.5px;min-height:18px;margin-bottom:8px"></div>
      <button class="btn" id="pw-go">حفظ</button><button class="out" style="margin-top:10px" onclick="closeSh()">إلغاء</button></div>`;
    document.body.appendChild(bg);
    document.getElementById('pw-go').onclick=async()=>{
      const v=id=>document.getElementById(id).value,er=document.getElementById('pw-err'),cur=v('pw-cur'),np=v('pw-new');
      if(!cur)return er.textContent='اكتب كلمة السر الحالية';
      if(np.length<6)return er.textContent='كلمة السر الجديدة 6 أحرف على الأقل';
      if(np!==v('pw-new2'))return er.textContent='التأكيد غير مطابق';
      er.textContent='… جارٍ';
      try{const u=auth.currentUser;
        await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));
        await u.updatePassword(np);closeSh();alert('✓ تغيّرت كلمة السر');
      }catch(e){er.textContent=(e&&/wrong-password|invalid-credential|invalid-login/.test(e.code||''))?'كلمة السر الحالية خاطئة':(e&&e.code==='auth/network-request-failed'?'لا يوجد اتصال بالإنترنت':'تعذّر التغيير — حاول لاحقاً');}
    };
  }
  function render(o){{const x=document.getElementById('shbg');if(x&&!x.dataset.keep)x.remove();} /* تحديث لحظي لا يغلق نافذة كلمة السر */
    const bd=side(o.bal.d,'d',D),bg=side(o.bal.g,'g',G);
    const list=(o.ev||[]).filter(e=>!(e.k==='cash'&&e.nb));window.EVS=list;
    const row=(i,t1,t2,am,cls,tap)=>`<div class="it tap" ${tap?`onclick="showInv(${i})"`:''}><div class="mn"><div class="t1">${t1}</div><div class="t2">${t2}</div></div><div class="am ${cls||''}">${am}</div>${tap?'<span class="ch">‹</span>':''}</div>`;
    const ev=list.map((e,i)=>{
      if(e.k==='inv'){const buy=e.type==='buy';
        return row(i,`${buy?'بعتَ للمحل':'اشتريتَ من المحل'} ${G(e.g)} غ`,`<span dir="ltr">${dt(e.d)}</span> · فاتورة <span dir="ltr">N°${esc(e.no)}</span> · ${e.settled?'خالصة':'غير خالصة'}`,D(e.money)+' دج',e.settled?'':'pos',true);}
      if(e.k==='cash'){
        if(e.note==='تسوية')return row(i,e.st==='buy'?'حساب: بعتَ ذهباً':'حساب: اشتريتَ ذهباً','<span dir="ltr">'+dt(e.d)+'</span>'+(e.sno?' · حساب N°'+esc(e.sno):''),G(e.amt)+' غ','',false);
        const pay=e.kind==='pay',g=e.cur==='730';
        return row(i,(pay?'دفعتَ':'أخذتَ')+(g?' ذهباً':''),'<span dir="ltr">'+dt(e.d)+'</span>'+(g&&e.m?' · '+G(e.m)+' غ × '+esc(e.q):''),g?G(e.amt)+' غ':D(e.amt)+' دج',pay?'neg':'pos',false);}
      if(e.k==='open'){const parts=[];if(Math.abs(e.din)>=1)parts.push((e.din<0?'−':'+')+' '+D(e.din)+' دج');if(Math.abs(e.g)>=0.005)parts.push((e.g<0?'−':'+')+' '+G(e.g)+' غ');
        return row(i,e.adj?'تعديل الرصيد':'رصيد سابق',e.d?'<span dir="ltr">'+dt(e.d)+'</span>':'',parts.join(' · ')||'—','',false);}
      return '';}).join('');
    $app.innerHTML=`<div class="top"><div class="shop">${esc(o.shop||'ذهب برو')}</div><div class="who">${esc(o.name)}</div></div>
    <div class="wrap"><div class="card"><div class="bal">
      <div><div class="l">الدينار</div><div class="v ${bd[0]}">${bd[2]}</div><div class="s ${bd[0]}">${bd[1]}</div></div>
      <div><div class="l">الذهب (730)</div><div class="v ${bg[0]}">${bg[2]} <small style="font-size:13px">غ</small></div><div class="s ${bg[0]}">${bg[1]}</div></div></div></div>
      <div class="card"><h3>معاملاتك</h3>${ev||'<div class="empty">لا توجد معاملات بعد</div>'}</div>
      <div class="upd">آخر تحديث: ${new Date(o.t).toLocaleString('ar-DZ')}</div>
      <button class="out" id="pw">🔑 تغيير كلمة السر</button>
      <button class="out" id="lo">تسجيل الخروج</button></div>`;
    document.getElementById('lo').onclick=()=>auth.signOut();
    document.getElementById('pw').onclick=passView;
  }
  let settled=false;
  const slow=setTimeout(()=>{if(!settled){hint(false);loginView();}},10000);
  auth.onAuthStateChanged(u=>{
    settled=true;clearTimeout(slow);hint(!!u);
    if(off){off();off=null;}
    if(!u){loginView();return;}
    $app.innerHTML='<div class="login"><div class="empty">… جارٍ التحميل</div></div>';
    const r=db.ref('portal/'+u.uid);
    const h=r.on('value',s=>{const v=s.val();
      if(!v||!v.v){$app.innerHTML='<div class="top"><div class="shop">ذهب برو</div></div><div class="login" style="margin-top:-40px"><div class="card"><div class="empty">لا توجد بيانات لحسابك بعد.<br>اطلب من المحل تحديثها.</div></div><button class="out" onclick="firebase.auth().signOut()">تسجيل الخروج</button></div>';return;}
      try{render(JSON.parse(v.v));}catch(e){$app.innerHTML='<div class="login"><div class="empty">تعذّر عرض البيانات</div></div>';}
    },e=>{$app.innerHTML='<div class="login"><div class="empty">لا صلاحية لعرض هذه البيانات.</div><button class="out" onclick="firebase.auth().signOut()">تسجيل الخروج</button></div>';});
    off=()=>r.off('value',h);
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
