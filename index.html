<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#063a33">
<script src="lock.js"></script>
<script src="kiosk.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>بوصلة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="بوصلة">
<style>
:root{
  --bg1:#f3f4fb; --bg2:#e8eaf4; --card:#ffffff;
  --navy:#0e1428; --navy2:#18203c; --navy3:#243158;
  --ink:#1a2036; --muted:#8b92a9; --muted2:#aab0c4;
  --gold:#efb52f; --gold2:#e39a10; --gold-deep:#b9820a;
  --gold-soft:#fdf4d6; --gold-line:#f1e0a3;
  --purple:#6a5af0; --purple-soft:#eeeaff;
  --green:#12a866; --green-soft:#e0f5ea;
  --red:#e33f57; --red-soft:#fde8eb;
  --line:#e8eaf2; --line2:#eef0f6;
  --sh-lg:0 18px 40px -12px rgba(14,20,40,.18);
  --sh-md:0 8px 22px -8px rgba(14,20,40,.14);
  --sh-sm:0 3px 10px rgba(14,20,40,.07);
  --r-lg:24px; --r-md:18px; --r-sm:13px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Noto Kufi Arabic','Segoe UI','Tajawal','Droid Arabic Kufi',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(66px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.hidden{display:none!important}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
input[inputmode="decimal"]{direction:ltr}

.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,#0e1428,#1a2340);
  padding:calc(15px + env(safe-area-inset-top)) 18px 15px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 8px 24px -8px rgba(14,20,40,.5);border-bottom:1px solid rgba(239,181,47,.18)}
.topbar .brand{display:flex;align-items:center;gap:11px}
.topbar .mark{width:38px;height:38px;border-radius:12px;flex:none;background:linear-gradient(140deg,#f4c645,#df9310);
  display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(223,147,16,.6)}
.topbar .tx b{color:#fff;font-weight:900;font-size:18px;letter-spacing:-.3px;display:block;line-height:1.1}
.topbar .tx span{color:#8e97b8;font-size:10.5px;font-weight:700;letter-spacing:2px}
.topbar .clock{color:#aab2d0;font-size:12px;font-weight:700;text-align:left;line-height:1.5}
.topbar .clock b{color:#efb52f;display:block;font-size:13.5px;font-weight:800}

.page{padding:18px 16px;max-width:660px;margin:0 auto}
.page.act{animation:fade .3s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.inv-fsbar{display:none}
@media (max-width:899px){
  body.inv-fs .topbar,body.inv-fs .nav{display:none}
  body.inv-fs{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  body.inv-fs .inv-fsbar{display:flex;align-items:center;position:sticky;top:0;z-index:45;margin:-18px -16px 14px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(120deg,#0e1428,#1a2340);box-shadow:0 8px 24px -8px rgba(14,20,40,.5)}
  .inv-fsbar h3{margin:0;color:#fff;font-size:19px;font-weight:900}
  .inv-fsbar .x{margin-inline-start:auto;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:18px;font-weight:900}
  /* الفاتورة تملأ الشاشة بالضبط: الجدول وحده يأخذ المساحة الباقية ويُمرَّر داخلياً إن كثرت الأسطر */
  body.inv-fs{padding-bottom:0;overflow:hidden}
  body.inv-fs #page-invoice{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 10px calc(8px + env(safe-area-inset-bottom));overflow:hidden}
  body.inv-fs .inv-fsbar{position:static;margin:0 -10px 8px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;flex:none}
  body.inv-fs .inv-fsbar h3{font-size:17px}
  body.inv-fs .inv-fsbar .x{width:36px;height:36px}
  body.inv-fs #invoice-form{flex:1;min-height:0;display:flex;flex-direction:column}
  body.inv-fs #invoice-form>*{flex:none}
  body.inv-fs #invoice-form .ihead{padding:0;border:0;box-shadow:none;background:none;margin-bottom:7px}
  body.inv-fs #invoice-form .field>label{display:none}
  body.inv-fs #invoice-form .ihead input{padding:10px 12px;font-size:15px;border-radius:12px}
  body.inv-fs #invoice-form .seg{padding:3px;border-radius:12px;gap:4px}
  body.inv-fs #invoice-form .seg button{padding:8px 4px;font-size:13.5px;border-radius:9px;white-space:nowrap}
  body.inv-fs #invoice-form .ihead+div{margin-bottom:7px!important;gap:8px!important}
  body.inv-fs #invoice-form .tbl{flex:1 1 auto;min-height:96px;display:flex;flex-direction:column}
  body.inv-fs #invoice-form .thead>div{padding:5px 2px;font-size:11px;gap:3px}
  body.inv-fs #invoice-form .taamim{font-size:9.5px;padding:3px 6px}
  body.inv-fs #invoice-form .tbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body.inv-fs #invoice-form .tbody .trow>div{padding:2px}
  body.inv-fs #invoice-form .tbody input{padding:8px 2px;font-size:14px}
  body.inv-fs #invoice-form .tbody .calc{font-size:13px}
  body.inv-fs #invoice-form .trow{grid-template-columns:18px minmax(0,.95fr) minmax(0,.8fr) minmax(0,.82fr) minmax(0,1.3fr) minmax(0,1.36fr)}
  body.inv-fs #invoice-form .tbody .idx{font-size:11.5px}
  body.inv-fs #invoice-form .tbody input{font-size:13.5px;letter-spacing:-.2px}
  body.inv-fs #invoice-form .trow2{grid-template-columns:minmax(0,1fr) auto auto;gap:12px}
  body.inv-fs #invoice-form .trow2 .takein{grid-column:2 / 4;min-width:150px}
  body.inv-fs #invoice-form .totals{margin-top:7px}
  body.inv-fs #invoice-form .trow2>div{padding:7px 10px}
  body.inv-fs #invoice-form .tmain .lab,body.inv-fs #invoice-form .tfin .lab{font-size:14.5px}
  body.inv-fs #invoice-form .takein input{padding:6px;font-size:14.5px}
  body.inv-fs #invoice-form>div[style*="height:16px"]{height:7px!important}
  body.inv-fs #invoice-form>.btn{padding:12px;font-size:15px;border-radius:13px}
  body.inv-fs #invoice-form #sh-res{max-height:24vh;overflow-y:auto}
}
.sugg{position:fixed;z-index:200;background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:0 14px 34px -10px rgba(14,20,40,.35);overflow-y:auto;overscroll-behavior:contain}
.sugg button{display:block;width:100%;text-align:start;padding:12px 14px;font-size:15px;font-weight:800;color:var(--ink);border-bottom:1px solid var(--line2);background:#fff}
.sugg button:last-child{border-bottom:0}
.sugg button:active,.sugg button.hl{background:var(--gold-soft)}
.sugg button b{color:var(--gold-deep)}
.tbody .calc,.trow2 .v{white-space:nowrap}
.ptitle{display:flex;align-items:center;gap:9px;margin:2px 2px 16px}
.ptitle h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.4px}
.ptitle .badge{margin-inline-start:auto;background:var(--card);color:var(--muted);font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;box-shadow:var(--sh-sm)}

.stat{border-radius:var(--r-lg);padding:22px;margin-bottom:15px;position:relative;overflow:hidden;cursor:pointer;transition:transform .14s ease}
.stat:active{transform:scale(.98)}
.stat .top{display:flex;align-items:center;gap:12px}
.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat .lbl{font-weight:800;font-size:15px}
.stat .go{margin-inline-start:auto;opacity:.7}
.stat .val{font-size:36px;font-weight:900;margin-top:18px;letter-spacing:-1px;line-height:1}
.stat .unit{font-size:16px;font-weight:800;margin-inline-start:7px;opacity:.75}
.stat .sub{font-size:12.5px;font-weight:700;margin-top:9px;opacity:.7}
.stat.cash{background:linear-gradient(135deg,#141c38,#1f2a4e);color:#fff;box-shadow:var(--sh-lg)}
.stat.cash::after{content:"";position:absolute;inset-inline-start:-40px;top:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(239,181,47,.22),transparent 70%);pointer-events:none}
.stat.cash .ic{background:rgba(239,181,47,.16);color:var(--gold)}
.stat.g730{background:linear-gradient(135deg,#fffaf0,#fdf1cf);color:var(--gold-deep);border:1px solid var(--gold-line);box-shadow:var(--sh-md)}
.stat.g730 .ic{background:linear-gradient(140deg,#f4c645,#df9310);color:#fff;box-shadow:0 6px 14px -4px rgba(223,147,16,.5)}
.stat.g730 .lbl{color:#8a6a14}

.open-card{background:linear-gradient(135deg,#6a5af0,#5646d6);color:#fff;border-radius:var(--r-lg);padding:18px;margin-bottom:15px;
  display:flex;align-items:center;gap:14px;box-shadow:0 12px 26px -10px rgba(106,90,240,.5);cursor:pointer;transition:transform .12s}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:15px}
@media(max-width:520px){.duo{grid-template-columns:1fr 1fr}}
.mini{border-radius:var(--r-lg);padding:17px;cursor:pointer;transition:transform .14s;box-shadow:var(--sh-md);border:1px solid var(--line);background:var(--card);min-width:0}
.mini:active{transform:scale(.97)}
.mini .mtop{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mini .mic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none}
.mini .mlbl{font-weight:800;font-size:13.5px}
.mini .mval{font-size:23px;font-weight:900;letter-spacing:-.6px;line-height:1;white-space:nowrap;overflow:hidden}
.mini .mval.big{font-size:19px}
.mini .mval.huge{font-size:15px}
.mini .munit{font-size:12px;font-weight:800;margin-inline-start:4px;opacity:.7}
.mini .msub{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini.exp .mic{background:var(--red-soft);color:var(--red)}
.mini.exp .mval{color:var(--red)}
.mini.sale{background:linear-gradient(135deg,#fffaf0,#fdf1cf);border-color:var(--gold-line)}
.mini.sale .mic{background:linear-gradient(140deg,#f4c645,#df9310);color:#fff}
.mini.sale .mlbl{color:#8a6a14}
.mini.sale .mval{color:var(--gold-deep)}
.mini.sale .msub{color:#a98c30}
.mini.sale.buyneed{background:linear-gradient(135deg,#fff6f7,#fde8eb);border-color:#f6c9d1}
.mini.sale.buyneed .mic{background:linear-gradient(140deg,#ef6b7f,#d8324c)}
.mini.sale.buyneed .mlbl{color:#b5233a}
.mini.sale.buyneed .msub{color:#c47083}
.mini.prof{background:linear-gradient(135deg,#f2fdf7,#dcf5e8);border-color:#bfe9d3}
.mini.prof .mic{background:linear-gradient(140deg,#2ecb84,#0d8b53);color:#fff}
.mini.prof .mlbl{color:#0d7a4a}
.mini.prof .mval{color:var(--green)}
.mini.prof .msub{color:#5aa383}
.mini.prof.loss{background:linear-gradient(135deg,#fff6f7,#fde8eb);border-color:#f6c9d1}
.mini.prof.loss .mic{background:linear-gradient(140deg,#ef6b7f,#d8324c)}
.mini.prof.loss .mlbl{color:#b5233a}
.mini.prof.loss .mval{color:var(--red)}
.mini.prof.loss .msub{color:#c47083}
.assets{background:linear-gradient(135deg,#1b1230,#2d1f4d);color:#fff;border-radius:var(--r-lg);padding:22px;
  box-shadow:0 18px 40px -14px rgba(45,31,77,.55);cursor:pointer;transition:transform .14s;position:relative;overflow:hidden}
.assets:active{transform:scale(.985)}
.assets::after{content:"";position:absolute;inset-inline-end:-50px;bottom:-70px;width:210px;height:210px;
  background:radial-gradient(circle,rgba(239,181,47,.20),transparent 70%);pointer-events:none}
.assets .atop{display:flex;align-items:center;gap:12px}
.assets .aic{width:44px;height:44px;border-radius:14px;background:rgba(239,181,47,.16);display:grid;place-items:center;font-size:20px;flex:none}
.assets .albl{font-weight:800;font-size:15px}
.assets .aval{font-size:34px;font-weight:900;margin-top:16px;letter-spacing:-1px;line-height:1;color:var(--gold)}
.qcash{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.qcash button{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 10px;border-radius:var(--r-lg);color:#fff;text-align:start;box-shadow:var(--sh-md);transition:transform .12s}
.qcash button:active{transform:scale(.97)}
.qcash .qin{background:linear-gradient(135deg,#12a866,#0d8b53)}
.qcash .qout{background:linear-gradient(135deg,#e33f57,#c72d44)}
.qcash .qic{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:900;font-size:19px;flex:none}
.qcash b{display:block;font-size:15px;font-weight:900;line-height:1.2}
.qcash small{display:block;font-size:10.5px;font-weight:700;opacity:.85}
.assets .aunit{font-size:15px;font-weight:800;margin-inline-start:7px;opacity:.75}
.assets .arows{margin-top:16px;border-top:1px solid rgba(255,255,255,.12);padding-top:13px;display:grid;gap:9px}
.assets .arow{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700}
.assets .arow .al{color:#a9b0cc}
.assets .arow .av{margin-inline-start:auto;font-weight:800}
.mini.rib{background:linear-gradient(135deg,#f3f0ff,#e6dffb);border-color:#d3c6f5}
.mini.rib .mic{background:linear-gradient(140deg,#9a6ff0,#6b3fd4);color:#fff}
.mini.rib .mlbl{color:#6b3fd4}
.mini.rib .mval{color:var(--purple)}
.mini.rib .msub{color:#9a83c8}
.mini.rib.loss .mic{background:linear-gradient(140deg,#ef6b7f,#d8324c)}
.mini.rib.loss .mval{color:var(--red)}
.mini.rib.loss .mlbl{color:#b5233a}
.mini.rib.loss .msub{color:#c47083}
.open-card:active{transform:scale(.98)}
.open-card .oic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.open-card .ot{font-weight:900;font-size:16px}
.open-card .od{font-size:12px;opacity:.85;font-weight:600;margin-top:3px}
.open-card .oarr{margin-inline-start:auto;opacity:.8}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px;border-radius:15px;font-weight:800;font-size:15.5px;width:100%;transition:transform .1s ease,filter .12s ease}
.btn:active{transform:scale(.975);filter:brightness(.97)}
.btn.primary{background:linear-gradient(135deg,#141c38,#243158);color:#fff;box-shadow:var(--sh-md)}
.btn.gold{background:linear-gradient(135deg,#f4c645,#df9310);color:#3a2a04;box-shadow:0 10px 22px -8px rgba(223,147,16,.5)}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(104px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:19px;
  background:linear-gradient(135deg,#f4c645,#df9310);color:#3a2a04;box-shadow:0 12px 28px -8px rgba(223,147,16,.6);display:grid;place-items:center;z-index:35;transition:transform .12s}
.fab:active{transform:scale(.9)}

/* net card */
.netcard{background:linear-gradient(135deg,#141c38,#243158);color:#fff;border-radius:var(--r-md);padding:16px 8px;margin-bottom:14px;display:flex;align-items:center;box-shadow:var(--sh-lg)}
.netcard .half{flex:1;text-align:center}
.netcard .nl{font-size:12px;font-weight:800;color:#aab2d0;margin-bottom:7px}
.netcard .nv{font-size:24px;font-weight:900;letter-spacing:-.5px}
.netcard .nv.pos{color:#4fe0a0}.netcard .nv.neg{color:#ff8095}.netcard .nv.zero{color:#dfe3ee}
.netcard .sep{width:1px;height:44px;background:rgba(255,255,255,.15)}

.ledger{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-md);border:1px solid var(--line)}
.lhead,.lrow{display:grid;grid-template-columns:minmax(0,1fr) var(--cd,1fr) var(--cg,1fr);align-items:center}
.lrow>div.num,.lhead>div:not(.nc){white-space:nowrap}
.lhead{background:linear-gradient(120deg,#141c38,#243158);color:var(--gold);font-weight:800;font-size:13px}
.lhead>div{padding:14px 12px;text-align:center}
.lhead .nc{text-align:start}
.lrow{border-top:1px solid var(--line2);transition:background .12s}
.lrow:active{background:var(--gold-soft)}
.lrow>div{padding:15px 10px;text-align:center;font-weight:800;font-size:14.5px}
@media (max-width:899px){.lrow>div{padding:14px 8px}.lrow>div.num{font-size:14px}.lhead>div{padding:13px 8px}}
.lrow .nc{text-align:start;display:flex;align-items:center;gap:10px}
.lrow .nm{font-weight:800;font-size:15px}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--muted2)}
.c730{color:var(--gold-deep)}

.searchbar{margin-bottom:14px}
.searchbar input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:700;outline:none;box-shadow:var(--sh-sm)}
.searchbar input:focus{border-color:var(--purple)}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .eic{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh-sm);color:var(--muted2)}
.empty p{font-weight:800;margin:6px 0 0;font-size:15px}
.empty small{font-weight:600;color:var(--muted2)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:75;background:linear-gradient(120deg,#0e1428,#1a2340);border-top:1px solid rgba(239,181,47,.18);
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:5px 8px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -8px rgba(14,20,40,.5)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:#8e97b8;font-weight:800;font-size:10px;border-radius:12px;transition:color .15s}
.nav button .ni{transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.nav button .ni,.nav button .ni svg{width:20px;height:20px}
.nav button.on{color:#3a2a04;background:linear-gradient(135deg,#f4c645,#df9310)}
.nav button.on .ni{transform:none}
.nav button.on.inv{color:#3a2a04}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(10,15,32,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:ov .22s ease}
@keyframes ov{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg1);width:100%;max-width:660px;border-radius:28px 28px 0 0;max-height:94vh;overflow-y:auto;animation:up .32s cubic-bezier(.18,.9,.28,1);padding:8px 0 calc(22px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grip{width:42px;height:5px;border-radius:5px;background:#cdd2e0;margin:9px auto 2px}
.shead{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 14px}
.shead h3{margin:0;font-size:20px;font-weight:900;letter-spacing:-.3px}
.shead .x{width:38px;height:38px;border-radius:13px;background:var(--card);display:grid;place-items:center;color:var(--muted);box-shadow:var(--sh-sm)}
.sbody{padding:0 18px}

.acard .num{white-space:nowrap}.acard>div:nth-child(2){min-width:0}
.acard{background:var(--card);border-radius:var(--r-md);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:var(--sh-sm);border:1px solid var(--line);transition:transform .1s}
.acard:active{transform:scale(.98)}
.acard .aic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:none}
.acard .at{font-weight:800;font-size:16px}
.acard .ad{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.acard .arr{margin-inline-start:auto;color:var(--muted2)}

.field{margin-bottom:15px}
.field>label{display:block;font-weight:800;font-size:12.5px;color:var(--muted);margin:0 4px 8px}
.field input,.field select{width:100%;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;font-weight:700;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(106,90,240,.1)}
.seg{display:flex;gap:7px;background:var(--card);padding:6px;border-radius:15px;border:1.5px solid var(--line)}
.seg button{flex:1;padding:12px;border-radius:11px;font-weight:800;font-size:14.5px;color:var(--muted);transition:all .15s}
.seg button.on{color:#fff;box-shadow:var(--sh-sm);background:linear-gradient(120deg,#141c38,#243158)}
.seg.buy button.on{background:linear-gradient(135deg,#12a866,#0d8b53)}
.seg.sell button.on{background:linear-gradient(135deg,#e33f57,#c72d44)}
.seg.pure button.on{background:linear-gradient(135deg,#f4c645,#df9310);color:#3a2a04}
.seg.cur button.on{background:linear-gradient(135deg,#6a5af0,#5646d6)}
.seg.type button.on{background:linear-gradient(120deg,#141c38,#243158)}
input[type="date"]{direction:ltr;text-align:center;font-size:14.5px!important;padding:12px!important;color-scheme:light}

.ihead{background:var(--card);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh-sm);border:1px solid var(--line);margin-bottom:14px}
.imeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ino{background:linear-gradient(135deg,#fdf4d6,#fbe6bd);color:var(--gold-deep);font-weight:900;padding:9px 15px;border-radius:12px;font-size:15px}
.idate{color:var(--muted);font-weight:700;font-size:12.5px;text-align:left}

.tbl{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);border:1px solid var(--line)}
.trow{display:grid;grid-template-columns:32px 1fr 1fr 1fr 1.05fr 1.05fr}
.thead{background:linear-gradient(120deg,#141c38,#243158);color:var(--gold);font-weight:800;font-size:12px;text-align:center}
.thead>div{padding:11px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.taamim{background:linear-gradient(135deg,#6a5af0,#5646d6);color:#fff;font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:8px;display:flex;align-items:center;gap:3px}
.tbody .trow{border-top:1px solid var(--line2)}
.tbody .trow.dup{background:rgba(227,63,87,.16);box-shadow:inset 3px 0 0 #e33f57}
.tbody .trow.dup input{color:var(--red);font-weight:900}
.tbody .trow>div{padding:5px 2px;display:flex;align-items:center;justify-content:center}
.tbody .idx{color:var(--muted2);font-weight:800;font-size:13px}
.tbody input{width:100%;border:none;background:transparent;text-align:center;font-size:14.5px;font-weight:800;padding:11px 2px;outline:none;color:var(--ink);border-radius:8px}
.tbody input:focus{background:var(--purple-soft)}
.tbody input::placeholder{color:#ccd0dd;font-weight:600}
.tbody .calc{font-weight:800;font-size:14px;color:var(--navy)}
.tbody .calc.c730{color:var(--gold-deep)}

.totals{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);border:1px solid var(--line);margin-top:14px}
.trow2{display:grid;grid-template-columns:1.3fr 1fr 1fr;align-items:center}
.trow2>div{padding:14px 12px;font-weight:800}
.trow2 .lab{text-align:start}
.trow2 .v{text-align:center;font-size:15px}
.tmain{background:linear-gradient(120deg,#fdf4d6,#fbe9c6)}
.tmain .lab{color:var(--gold-deep);font-size:16px}
.tsub{border-top:1px solid var(--line2)}
.tfin{background:linear-gradient(120deg,#141c38,#243158);color:#fff}
.tfin .lab{color:var(--gold);font-size:16px}
.tfin .v{color:var(--gold);font-size:18px;font-weight:900}
.takein{grid-column:2 / 4}
.takein input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px;text-align:center;font-weight:800;font-size:15px;background:var(--bg1);outline:none}

/* opening grids */
.oggrid{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);border:1px solid var(--line);margin-bottom:8px}
.oghead{background:linear-gradient(120deg,#141c38,#243158);color:var(--gold);font-weight:800;font-size:12.5px;display:grid}
.oghead>div{padding:11px 6px;text-align:center}

.ogrow input:focus{background:var(--purple-soft)}
.ogrow input::placeholder{color:#ccd0dd;font-weight:600}
.og3{grid-template-columns:1.5fr 1fr 1fr}
.og3 input.name{text-align:start;color:var(--navy)}
.og2{grid-template-columns:1fr 1fr}
.oglabel{font-weight:900;font-size:14px;color:var(--muted);margin:16px 4px 10px;display:flex;align-items:center;gap:8px}

.ssec .sh{font-weight:900;font-size:14px;color:var(--muted);margin:16px 4px 11px;display:flex;align-items:center;gap:8px}

/* fullscreen stock */
.fs{position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,#f3f4fb,#e8eaf4);display:flex;flex-direction:column;animation:fsin .3s cubic-bezier(.2,.9,.3,1)}

.fs .fhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;background:linear-gradient(120deg,#0e1428,#1a2340);color:#fff;box-shadow:0 8px 24px -8px rgba(14,20,40,.4)}
.fs .fhead h3{margin:0;font-size:23px;font-weight:900}

.fs-ing{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:13px;box-shadow:var(--sh-md);display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;border:1px solid var(--line)}
.fs-ing .w{font-size:28px;font-weight:900;color:var(--navy);white-space:nowrap}
.fs-ing .w small{font-size:15px;color:var(--muted);font-weight:800}
.fs-ing .k{font-size:20px;font-weight:900;color:var(--gold-deep);background:var(--gold-soft);padding:8px 18px;border-radius:12px;white-space:nowrap}
.fs-ing{flex-wrap:wrap;padding:14px 16px;gap:10px 14px}
.fs-ing .w{font-size:24px}
.fs-ing .k{font-size:17px;padding:6px 14px}
.fs-ing .ing-more{margin-inline-start:auto;width:42px;height:42px;border-radius:12px;background:var(--bg1);color:var(--navy);font-size:24px;font-weight:900;line-height:1;flex:none}
.fs-ing.open .ing-more{background:var(--navy);color:#fff}
.fs-ing .ing-info{width:100%;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;font-weight:800;color:var(--muted);border-top:1px solid var(--line2);padding-top:10px}
.fs-ing .ing-acts{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fs-ing .ing-acts button{font-weight:800;font-size:13px;padding:11px 6px;border-radius:11px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.fs-ing .ing-acts button svg{width:15px;height:15px}
.fs-ing .eq{margin-inline-start:auto;font-size:19px;font-weight:800;color:var(--muted);white-space:nowrap;text-align:left}
.fs-ing .eq small{display:block;font-size:11px;font-weight:700}
@media(min-width:820px){
  .fs-ing{padding:24px 30px;gap:24px}
  .fs-ing .w{font-size:40px}.fs-ing .w small{font-size:19px}
  .fs-ing .k{font-size:27px;padding:11px 26px}.fs-ing .eq{font-size:25px}
  .fs-tot{font-size:20px;padding:24px}.fs-tot b{font-size:34px}
}

.ingot{background:var(--card);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;box-shadow:var(--sh-sm);border:1px solid var(--line);display:flex;align-items:center;gap:13px}

.pdfview{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--sh-md);overflow-x:auto}

  #page-home .stat .ic{width:38px;height:38px;border-radius:12px}
  #page-home .stat .ic svg{width:20px;height:20px}
  #page-home .stat .lbl{font-size:13px;line-height:1.25}
  #page-home .stat .go{display:none}
  #page-home .stat .val{font-size:26px;margin-top:8px;letter-spacing:-.6px;white-space:nowrap}
  #page-home .stat .val.big{font-size:21px}
  #page-home .stat .val.huge{font-size:16.5px}
  #page-home .stat .unit{font-size:12.5px;margin-inline-start:5px}
  #page-home .stat .sub{font-size:10.5px;margin-top:6px;line-height:1.35}
  #page-home .mini{margin:0;padding:12px;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between}
  #page-home .mini .mtop{margin-bottom:6px}
  #page-home .mini .mic{width:32px;height:32px;border-radius:10px}
  #page-home .mini .mval{font-size:22px}
  #page-home .mini .mval.big{font-size:18px}
  #page-home .mini .mval.huge{font-size:14.5px}
  #page-home .mini .msub{margin-top:5px}
  #page-home .assets{grid-column:1/-1;margin:0;padding:12px 16px;border-radius:22px;display:flex;align-items:center;gap:10px}
  #page-home .assets .atop{gap:10px}
  #page-home .assets .aic{width:38px;height:38px;border-radius:12px;font-size:18px}
  #page-home .assets .albl{font-size:13.5px}
  #page-home .assets .aval{font-size:24px;margin:0;margin-inline-start:auto;white-space:nowrap}
  #page-home .assets .aval.big{font-size:19px}
  #page-home .assets .arows{display:none}
}
@media (max-width:899px) and (max-height:780px){
  #page-home:not(.hidden){gap:8px;padding:10px}
  #page-home .qcash button{padding:8px}
  #page-home .qcash small{display:none}
  #page-home .stat{padding:11px 12px}
  #page-home .stat .ic{width:32px;height:32px;border-radius:10px}
  #page-home .stat .ic svg{width:17px;height:17px}
  #page-home .stat .val{font-size:23px;margin-top:4px}
  #page-home .stat .val.big{font-size:19px}
  #page-home .stat .val.huge{font-size:15px}
  #page-home .stat .sub{margin-top:3px}
  #page-home .mini{padding:10px 11px}
  #page-home .mini .mic{width:27px;height:27px;border-radius:9px;font-size:14px}
  #page-home .mini .mtop{margin-bottom:3px}
  #page-home .mini .mval{font-size:20px}
  #page-home .mini .mval.big{font-size:17px}
  #page-home .mini .mval.huge{font-size:14px}
  #page-home .mini .msub{margin-top:3px}
  #page-home .assets{padding:9px 14px}
  #page-home .assets .aic{width:32px;height:32px;font-size:16px}
  #page-home .assets .aval{font-size:21px}
}
@media (max-width:899px) and (max-height:680px){
  #page-home .mini .msub,#page-home .stat .sub{font-size:9.5px}
  #page-home .mini .mtop{margin-bottom:1px}
  #page-home .stat .top .lbl,#page-home .mini .mlbl{font-size:12px}
  #page-home:not(.hidden){gap:6px;padding:8px}
  #page-home .stat{padding:8px 11px}
  #page-home .stat .ic{width:28px;height:28px}
  #page-home .stat .val{font-size:21px;margin-top:2px}
  #page-home .mini{padding:7px 10px}
  #page-home .mini .mic{width:24px;height:24px;font-size:12px}
  #page-home .mini .mval{font-size:18px}
  #page-home .assets{padding:7px 13px}
  #page-home .assets .aic{width:28px;height:28px}
  #page-home .assets .aval{font-size:19px}
}

<div class="topbar">
  <div class="brand">

  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="clock" id="clock"></div>
    <button id="fsbtn" onclick="toggleFS()" title="ملء الشاشة / إغلاق" style="width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.10);color:#aab2d0;display:grid;place-items:center;flex:none">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="2.1"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<!-- HOME -->
<div class="page act" id="page-home">
  <div class="ptitle"><h2>الرئيسية</h2></div>
  <div id="open-slot"></div>
  <div class="stat cash" onclick="openCashLedger()">
    <div class="top">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="6" width="19" height="12" rx="2.5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="2"/><path d="M6 9v6M18 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span class="lbl">صوارد الكوفر</span>
      <span class="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="val num" id="home-cash">0<span class="unit">دج</span></div>
    <div class="sub">رصيد الصندوق الحالي</div>
  </div>
  <div class="stat g730" onclick="openStock()">
    <div class="top">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6" rx="7" ry="2.6" stroke="currentColor" stroke-width="2"/><path d="M5 6v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 12v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6" stroke="currentColor" stroke-width="2"/></svg></span>
      <span class="lbl">ذهب الكوفر</span>
      <span class="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="val num" id="home-730">0<span class="unit">غ</span></div>
    <div class="sub">مجموع السبائك مكافئ 730</div>
  </div>
  <div class="duo">
    <div class="mini exp" onclick="openExpenses()">
      <div class="mtop"><span class="mic">🧾</span><span class="mlbl">مصاريف</span></div>
      <div class="mval num" id="home-exp">0<span class="munit">دج</span></div>
      <div class="msub" id="home-exp-sub">هذا الشهر</div>
    </div>
    <div class="mini sale" id="sale-card" onclick="openSaleGold()">
      <div class="mtop"><span class="mic">⚖️</span><span class="mlbl" id="home-sale-lbl">ذهب البيع</span></div>
      <div class="mval num" id="home-sale">0<span class="munit">غ</span></div>
      <div class="msub" id="home-avg">متوسط الشراء —</div>
    </div>
    <div class="mini prof" onclick="openProfit()">
      <div class="mtop"><span class="mic">📈</span><span class="mlbl">الفائدة</span></div>
      <div class="mval num" id="home-prof">0<span class="munit">دج</span></div>
      <div class="msub" id="home-prof-sub">المتاح للسحب</div>
    </div>
    <div class="mini rib" onclick="openNotes()">
      <div class="mtop"><span class="mic">📓</span><span class="mlbl">ترباح</span></div>
      <div class="mval num" id="rib-net">0<span class="munit">دج</span></div>
      <div class="msub" id="rib-sub">ملاحظات فقط</div>
    </div>
  </div>
  <div class="assets" id="assets-card" onclick="openAssets()">
    <div class="atop"><span class="aic">🏦</span><span class="albl">الأصول الإجمالية</span></div>
    <div class="aval num" id="assets-val">0<span class="aunit">دج</span></div>
    <div class="arows" id="assets-rows"></div>
  </div>
  <div class="qcash">
    <button class="qin" onclick="openQuickCash('in')"><span class="qic">↓</span><span><b>أخذت</b><small>دينار أو ذهب</small></span></button>
    <button class="qout" onclick="openQuickCash('out')"><span class="qic">↑</span><span><b>دفعت</b><small>دينار أو ذهب</small></span></button>
  </div>
</div>

<!-- DEBTS -->
<div class="page hidden" id="page-debts">
  <div class="ptitle"><h2>دفتر الديون</h2><span class="badge" id="debts-count"></span></div>
  <input id="debt-q" placeholder="🔍 بحث باسم الزبون..." oninput="renderDebts()"
    style="width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:700;outline:none;margin-bottom:16px;box-shadow:var(--sh-sm)">

</div>

  <div id="invoice-form"></div>
</div>

    <button data-t="sell" onclick="pickArchType(this)">بيع</button>

    <button data-p="day" onclick="pickArchPer(this)">يوم</button>
    <button data-p="month" onclick="pickArchPer(this)">شهر</button>
  </div>
  <div id="arch-perin" style="margin-bottom:14px"></div>
  <div id="arch-sum" style="margin-bottom:12px"></div>
  <div id="archive-list"></div>
</div>

</button>

  <button data-p="debts" onclick="go('debts')"><span class="ni"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 19.5v-15Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>الديون</button>

/* ========= حسابات ========= */
function coffer(){
  let c=DB.openCash||0;
  DB.cash.forEach(x=>{if(x.cur!=='730')c+=x.kind==='pay'?+x.amount:-x.amount;});
  DB.invoices.forEach(inv=>{if(inv.settled)c+=inv.type==='buy'?-inv.money:+inv.money;});
  DB.expenses.forEach(e=>c-=e.amount);
  DB.withdrawals.forEach(w=>c-=w.amount);
  return c;
}
/* ===== دفعات التكلفة: كل شراء يُنشئ دفعة، والبيع يختار منها يدوياً ===== */
function sellOps(){ // كل عمليات البيع: فواتير البيع + بيع الحساب (تسوية)
  const r=[];DB.invoices.forEach(i=>{if(i.type==='sell')r.push({t:i.total730,m:i.money,alloc:i.alloc||[],date:i.date||0,h:i,k:'alloc'});});
  DB.cash.forEach(c=>{if(c.note==='تسوية'&&c.cur==='730'&&c.sType==='sell')r.push({t:+c.amount||0,m:+c.sMoney||0,alloc:c.sAlloc||[],date:c.date||0,h:c,k:'sAlloc'});});
  return r;}
function opPending(o){ // الوزن المبيع الذي لا تغطيه دفعة شراء موجودة
  return Math.max(0,o.t-o.alloc.reduce((s,a)=>s+((DB.lots||[]).some(L=>L.id===a.lotId)?a.g:0),0));}
let COVER_OFF=false;
function lotLinks(ids){ // روابط البيوع بدفعات معيّنة (لحفظها قبل الحذف وإعادتها بالضبط عند الاسترجاع)
  const L=[];sellOps().forEach(o=>o.alloc.forEach(a=>{if(ids.includes(a.lotId))L.push({hid:o.h.id,k:o.k,lotId:a.lotId,g:a.g});}));return L;}
function reattach(links){
  (links||[]).forEach(x=>{const h=x.k==='alloc'?DB.invoices.find(i=>i.id===x.hid):DB.cash.find(c=>c.id===x.hid);if(!h)return;
    const lot=DB.lots.find(l=>l.id===x.lotId);if(!lot)return;
    const o=sellOps().find(o=>o.h===h);if(!o)return;const g=Math.min(x.g,opPending(o),lotRem(lot));if(g<=0.0005)return;
    if(!h[x.k])h[x.k]=[];const ex=h[x.k].find(a=>a.lotId===x.lotId);if(ex)ex.g+=g;else h[x.k].push({lotId:x.lotId,g});});}
function allocFits(alloc){ // هل تتسع الدفعات للتخصيص الأصلي؟
  const need={};(alloc||[]).forEach(a=>need[a.lotId]=(need[a.lotId]||0)+a.g);
  // رابط قائم يُعاد كما كان ولو وُسمت الدفعة «غالي» لاحقاً
  return Object.keys(need).every(id=>{const l=DB.lots.find(x=>x.id===id);return l&&lotRem(l)+0.0005>=need[id];});}
function coverPending(lot){ // شراء جديد يغطي أولاً ما بِيع قبل شرائه (الأقدم أولاً) — فتُصحَّح فائدته بالسعر الحقيقي
  if(!lot||lot.pricey||COVER_OFF)return;
  let cap=lotRem(lot);
  sellOps().filter(o=>o.t>0&&o.m>0).sort((a,b)=>a.date-b.date).forEach(o=>{
    if(cap<=0.0005)return;const need=opPending(o);if(need<=0.0005)return;
    const t=Math.min(cap,need);if(!o.h[o.k])o.h[o.k]=[];
    const ex=o.h[o.k].find(a=>a.lotId===lot.id);if(ex)ex.g+=t;else o.h[o.k].push({lotId:lot.id,g:t});
    cap-=t;});
}
function detachLot(id){ // عند حذف شراء: تُفكّ روابط البيوع بدفعته (تعود «بانتظار الشراء»)
  DB.invoices.forEach(i=>{if(i.alloc)i.alloc=i.alloc.filter(a=>a.lotId!==id);});
  DB.cash.forEach(c=>{if(c.sAlloc)c.sAlloc=c.sAlloc.filter(a=>a.lotId!==id);});}
function ntPool(){ // مشتريات الترباح (الأقدم أولاً) بعد خصم ما بِيع منها في دفتر الترباح
  const buys=(DB.notes||[]).filter(n=>n.type!=='sell'&&+n.weight>0).sort((a,b)=>(a.date||0)-(b.date||0)).map(n=>({w:+n.weight,p:+n.price||0}));
  let sold=(DB.notes||[]).filter(n=>n.type==='sell').reduce((s,n)=>s+(+n.weight||0),0);
  for(const b of buys){if(sold<=0)break;const t=Math.min(b.w,sold);b.w-=t;sold-=t;}
  return buys.filter(b=>b.w>0.0005);}
function lotUsed(id){let u=0;sellOps().forEach(o=>o.alloc.forEach(a=>{if(a.lotId===id)u+=a.g;}));return u;}
function lotRem(l){return Math.max(0,l.w730-lotUsed(l.id));}
function realLots(){return (DB.lots||[]).filter(l=>l.src!=='manual');} // الوسم اليدوي «غالي» حجزٌ لا شراء: لا يدخل التقويم ولا المتوسطات
function lotsAvail(){return (DB.lots||[]).map(l=>({...l,rem:lotRem(l)})).filter(l=>l.rem>0.0005);}
function priceyG(){return (DB.lots||[]).filter(l=>l.pricey).reduce((s,l)=>s+lotRem(l),0);} // ذهب «غالي» مستبعَد من البيع
function toggleLotPricey(id){const l=(DB.lots||[]).find(x=>x.id===id);if(!l)return;l.pricey=!l.pricey;logAct('ذهب',(l.pricey?'وسم «غالي»: ':'إزالة «غالي»: ')+lotLabel(l)+' — '+fmt(lotRem(l),2)+' غ');save();renderHome();openSaleDetailRefresh();toast(l.pricey?'وُسمت «غالي» — لن تُحسب في البيع':'أُزيلت علامة «غالي»');}
function autoAlloc(needG,existing){ // تخصيص تلقائي بلا نافذة: غير الغالي أولاً
  const av=lotsAvail().map(l=>({...l}));
  (existing||[]).forEach(a=>{const l=av.find(x=>x.id===a.lotId);
    if(l)l.rem+=a.g; else{const src=(DB.lots||[]).find(x=>x.id===a.lotId);if(src)av.push({...src,rem:a.g});}});
  // «غالي» محجوز ولا يُباع منه أبداً تلقائياً — ما زاد عن الدفعات العادية يبقى بلا تكلفة (خارج الفائدة)
  const alloc=[];let rem=needG;
  for(const l of av.filter(x=>!x.pricey)){if(rem<=0.0005)break;const t=Math.min(l.rem,rem);if(t>0.0005){alloc.push({lotId:l.id,g:t});rem-=t;}}
  return alloc;
}
function lotLabel(l){if(l.src==='opening')return 'افتتاحية';if(l.src==='manual')return 'غالي يدوي';
  if(l.src==='settle'){const c=DB.customers.find(x=>x.id===l.customerId);return 'شراء حساب'+(c?(' — '+c.name):'');}
  return 'فاتورة N°'+(l.no||'');}
function profitCalc(){
  // الفائدة على الوزن المخصَّص من دفعات الشراء التي اخترتها عند البيع
  let matched=0,mBuyM=0,mSellM=0,unmSell=0;
  const pend=[];
  sellOps().filter(o=>o.t>0&&o.m>0).forEach(o=>{ // البيع بلا سعر لا يدخل الفائدة
    const sp=o.m/o.t;let a=0;
    o.alloc.forEach(x=>{
      const lot=(DB.lots||[]).find(L=>L.id===x.lotId);if(!lot)return;
      matched+=x.g;mBuyM+=x.g*lot.price;mSellM+=x.g*sp;a+=x.g;
    });
    if(o.t-a>0.0005)pend.push({g:o.t-a,sp,date:o.date});
  });
  // ما بِيع قبل شرائه: يُحسب مؤقتاً بسعر شراء الترباح حتى يصل الشراء الحقيقي
  let ntG=0;const pool=ntPool();
  pend.sort((a,b)=>a.date-b.date).forEach(x=>{let g=x.g;
    for(const b of pool){if(g<=0.0005)break;if(b.w<=0.0005)continue;const t=Math.min(b.w,g);
      matched+=t;mBuyM+=t*b.p;mSellM+=t*x.sp;ntG+=t;b.w-=t;g-=t;}
    if(g>0.0005)unmSell+=g;});
  const unsold=realLots().reduce((s,l)=>s+lotRem(l),0);
  const avgBuy=matched>0?mBuyM/matched:0;
  const avgSell=matched>0?mSellM/matched:0;
  const gross=mSellM-mBuyM;
  const expenses=DB.expenses.reduce((s,e)=>s+e.amount,0);
  const net=gross-expenses;
  const withdrawn=DB.withdrawals.reduce((s,w)=>s+w.amount,0);
  let buyG=0,sellG=0;DB.invoices.forEach(i=>{if(i.type==='buy')buyG+=i.total730;else sellG+=i.total730;});
  (DB.lots||[]).forEach(l=>{if(l.src==='opening')buyG+=l.w730;});
  DB.cash.forEach(c=>{if(c.note==='تسوية'&&c.cur==='730'){if(c.sType==='buy')buyG+=+c.amount||0;else sellG+=+c.amount||0;}});
  return {buyG,sellG,matched,avgBuy,avgSell,perG:avgSell-avgBuy,gross,expenses,net,withdrawn,
          available:net-withdrawn,unsold,unmSell,ntG};
}
function netDebt730(){return DB.customers.reduce((s,c)=>s+custBalance(c.id).g730,0);}
function netDebtDinar(){return DB.customers.reduce((s,c)=>s+custBalance(c.id).dinar,0);}
function refPrice(){ // سعر مرجعي لتقويم الذهب بلا سعر شراء
  if(DB.refP>0)return DB.refP;                              // سعر حدّدته يدوياً
  const lots=realLots().map(l=>({...l,rem:lotRem(l)})).filter(l=>l.rem>0.0005);
  const g=lots.reduce((s,l)=>s+l.rem,0);
  if(g>0)return lots.reduce((s,l)=>s+l.rem*l.price,0)/g;   // متوسط الدفعات المتبقية
  const ab=avgBuyPrice();if(ab>0)return ab;                 // متوسط الشراء
  let m=0,w=0;DB.invoices.filter(i=>i.type==='sell').forEach(i=>{m+=i.money;w+=i.total730;});
  if(w>0)return m/w;                                        // متوسط البيع
  const all=realLots();                                     // أي دفعة ولو استُهلكت
  if(all.length)return all.reduce((s,l)=>s+l.price,0)/all.length;
  return 0;
}
function assetsCalc(){
  const cash=coffer();
  const dDebt=netDebtDinar();
  const gDebt=netDebt730();                                  // صافي ديون الذهب
  const stG=stock730();                                      // ذهب الكوفر
  const goldG=stG+gDebt;                                     // إجمالي الذهب المملوك فعلاً
  const lots=realLots().map(l=>({...l,rem:lotRem(l)})).filter(l=>l.rem>0.0005);
  const lotG=lots.reduce((s,l)=>s+l.rem,0);
  const lotVal=lots.reduce((s,l)=>s+l.rem*l.price,0);
  const avgLot=lotG>0?lotVal/lotG:0;                          // متوسط ذهب البيع نفسه
  const refP=refPrice();
  // الذهب يُقوَّم مجتمعاً: ما يقابله دفعات مسعّرة بسعرها، والباقي بالسعر المرجعي
  const pricedG=Math.min(lotG,Math.max(0,goldG));
  const pricedVal=pricedG*avgLot;
  const restG=goldG-pricedG;
  const restVal=restG*refP;
  const goldVal=pricedVal+restVal;
  const total=cash+dDebt+goldVal;
  return {cash,dDebt,gDebt,stG,goldG,goldVal,lotG,lotVal,avgLot,pricedG,pricedVal,restG,restVal,refP,total};
}

/* ===== كشف السبائك المكرّرة (نفس الميزان ونفس العيار) ===== */
const ingKey=(m,q)=>(+m).toFixed(2)+'×'+(+q);
function dupHits(items,skip){ // [{m,q}] → السبائك المطابقة لموجودة في ذهب الكوفر أو المكرّرة في نفس الإدخال
  const inStock={};DB.stock.forEach(x=>{if(skip&&skip(x))return;const k=ingKey(x.mizan,x.qoubal);(inStock[k]=inStock[k]||[]).push(x);});
  const seen={},hits=[],rows={};
  items.forEach((it,i)=>{if(!(+it.m>0&&+it.q>0))return;const k=ingKey(it.m,it.q);seen[k]=(seen[k]||0)+1;});
  items.forEach((it,i)=>{if(!(+it.m>0&&+it.q>0))return;const k=ingKey(it.m,it.q);
    if((inStock[k]||[]).length||seen[k]>1){rows[i]=1;if(!hits.some(h=>h.k===k))hits.push({k,m:+it.m,q:+it.q,st:inStock[k]||[],twice:seen[k]>1});}});
  return {hits,rows};
}
const dupSrc=x=>{const c=DB.customers.find(y=>y.id===x.customerId);const d=new Date(x.date||0);
  return (c?c.name:'بدون زبون')+(x.date>946684800000?' ('+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+')':'');};
function dupLines(hits){return hits.map(h=>'• '+fmt(h.m,2)+' غ × عيار '+h.q+(h.st.length?(' — موجودة في ذهب الكوفر'+(h.st.length>1?' ('+h.st.length+' مرات)':'')+': '+h.st.slice(0,3).map(dupSrc).join('، ')):'')+(h.twice?' — مكتوبة مرتين هنا':''));}
function dupConfirm(items,skip){ // يسأل قبل إدخال سبيكة مطابقة لموجودة في المخزون أو مكرّرة في نفس الإدخال
  const {hits}=dupHits(items,skip);
  if(!hits.length)return true;
  return confirm('⚠️ سبيكة مكرّرة\n\n'+dupLines(hits).join('\n')
    +'\n\nهل هي سبيكة أخرى فعلاً؟\nموافق = متابعة الحفظ · إلغاء = الرجوع للتصحيح');
}
function dupBox(hits){return hits.length?`<div class="warn" style="display:block;text-align:start;margin:10px 0;background:rgba(227,63,87,.12);border:1.5px solid #e33f57;color:var(--red);line-height:1.9">⚠️ <b>سبيكة مكرّرة — تحقق قبل الحفظ</b><br>${dupLines(hits).map(l=>l.replace(/</g,'&lt;')).join('<br>')}</div>`:'';}
function stock730(){return DB.stock.reduce((s,x)=>s+x.w730,0);}
function avgBuyPrice(){ // متوسط سعر شراء الغرام (730)
  let m=0,g=0;DB.invoices.filter(i=>i.type==='buy').forEach(i=>{m+=i.money;g+=i.total730;});
  return g>0?m/g:0;
}
function custBalance(cid){
  let dinar=0,g730=0;
  DB.openings.filter(o=>o.customerId===cid).forEach(o=>{dinar+=(+o.dinar||0);g730+=(+o.g730||0);});
  DB.invoices.filter(i=>i.customerId===cid).forEach(inv=>{const sign=inv.type==='buy'?+1:-1;if(!inv.settled)dinar+=-sign*inv.money;});
  DB.cash.filter(c=>c.customerId===cid).forEach(c=>{if(c.noBal)return;const s=c.kind==='pay'?-1:+1;if(c.cur==='730')g730+=s*c.amount;else dinar+=s*c.amount;});
  return {dinar,g730};
}
function custLastActivity(cid){ // تاريخ آخر معاملة للزبون
  let last=0;
  DB.invoices.forEach(i=>{if(i.customerId===cid&&i.date>last)last=i.date;});
  DB.cash.forEach(c=>{if(c.customerId===cid&&(c.date||0)>last)last=c.date;});
  DB.openings.forEach(o=>{if(o.customerId===cid&&(o.date||0)>last)last=o.date;});
  return last;
}

let EDIT_NAV=false;
function go(p){
  closeModal();
  if(INV&&INV.editId&&p!=='invoice'){INV=null;pendingEdit=null;}  // مغادرة التعديل تلغيه
  ['home','debts','invoice','archive'].forEach(x=>{
    const pg=document.getElementById('page-'+x);pg.classList.toggle('hidden',x!==p);
    if(x===p){pg.classList.remove('act');void pg.offsetWidth;pg.classList.add('act');}});
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.body.classList.toggle('inv-fs',p==='invoice');window.scrollTo(0,0);
  document.getElementById('fab').classList.toggle('hidden',p!=='debts');
  if(p==='home')renderHome();
  if(p==='debts')renderDebts();
  if(p==='invoice'){
    // وضع التعديل يُفتح من الأرشيف فقط — الدخول من الشريط يبدأ فاتورة جديدة
    if(!INV||(INV.editId&&!EDIT_NAV))newInvoice(); else renderInvoiceForm();
    EDIT_NAV=false;
  }
  if(p==='archive')renderArchive();
}

const balZero=b=>Math.abs(b.dinar)<0.5&&Math.abs(b.g730)<0.005;
function renderDebts(){
  const el=document.getElementById('debts-list');

  const match=c=>!q||c.name.includes(q);
  const act=DB.customers.map(c=>({c,b:custBalance(c.id)}))
    .filter(x=>!balZero(x.b))
    .filter(x=>match(x.c))
    .sort((a,b)=>custLastActivity(b.c.id)-custLastActivity(a.c.id)); // الأحدث معاملةً أولاً
  document.getElementById('debts-count').textContent=act.length?act.length+' زبون':'';
  let netD=0,netG=0;act.forEach(x=>{netD+=x.b.dinar;netG+=x.b.g730;});

    <div class="sep"></div>

  const zeros=DB.customers.map(c=>({c,b:custBalance(c.id)}))
    .filter(x=>balZero(x.b))
    .filter(x=>match(x.c));
  const note=zeros.length?`
    <div style="margin-top:14px">
      <button onclick="toggleZeros()" id="zbtn" style="width:100%;padding:12px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);color:var(--muted);font-weight:800;font-size:12.5px">
        ▾ زبائن بلا رصيد (${zeros.length})</button>
      <div id="zlist" class="${q?'':'hidden'}" style="margin-top:10px">
        <div class="ledger">${zeros.map(({c})=>`
          <div class="lrow" style="grid-template-columns:1fr" onclick="openCustomer('${c.id}')">
            <div class="nc"><span class="nm" style="color:var(--muted)">${c.name}</span></div></div>`).join('')}</div>
      </div></div>`:'';
  if(!act.length){el.innerHTML=summary+emptyBox(q?'لا زبون بهذا الاسم':'لا توجد ديون',q?'جرّب اسماً آخر':(DB.customers.length?'كل الحسابات مصفّاة':'اضغط زر + لإضافة زبون'))+note;return;}
  const rows=act.map(({c,b})=>
    `<div class="lrow" onclick="openCustomer('${c.id}')">
      <div class="nc"><span class="nm">${c.name}</span></div>
      <div class="num ${clsSign(b.dinar)}">${fmt(Math.abs(b.dinar),0)}</div>
      <div class="num ${clsSign(b.g730)}">${fmt(Math.abs(b.g730),2)}</div></div>`).join('');
  el.innerHTML=summary+`<div class="ledger"><div class="lhead"><div class="nc">الزبون</div><div>الدينار</div><div>الـ730</div></div>${rows}</div>`+note;
  fitLedger(el);

function fitLedger(root){ // عرض عمودَي الأرقام = أطول رقم فيهما، فلا ينكسر رقم على سطرين
  const lg=root&&root.querySelector('.ledger');if(!lg)return;
  const rows=[...lg.querySelectorAll('.lrow')].filter(r=>r.children.length>=3);if(!rows.length)return;
  const w=i=>Math.max(...rows.map(r=>{const c=r.children[i];const sp=document.createElement('span');sp.className=c.className;
    sp.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font-weight:800;font-size:'+getComputedStyle(c).fontSize;
    sp.textContent=c.textContent;document.body.appendChild(sp);const x=sp.getBoundingClientRect().width;sp.remove();return x;}));
  const pad=parseFloat(getComputedStyle(rows[0].children[1]).paddingLeft)*2||24;
  lg.style.setProperty('--cd',Math.ceil(Math.max(w(1),40)+pad+2)+'px');
  lg.style.setProperty('--cg',Math.ceil(Math.max(w(2),34)+pad+2)+'px');
}

function toggleZeros(){
  const l=document.getElementById('zlist'),b=document.getElementById('zbtn');
  const open=l.classList.toggle('hidden');
  b.textContent=b.textContent.replace(open?'▴':'▾',open?'▾':'▴');
}

function saveWithdraw(){

  toTrash('withdraw',w);

function notesTot(){
  let buy=0,sell=0,buyW=0,sellW=0;
  (DB.notes||[]).forEach(n=>{const w=(+n.weight||0),v=w*(+n.price||0);
    if(n.type==='sell'){sell+=v;sellW+=w;}else{buy+=v;buyW+=w;}});
  return {buy,sell,net:sell-buy,buyW,sellW,netW:sellW-buyW};
}

function notesListHTML(list){

function ntPick(btn){
  NT_TYPE=btn.dataset.t;
  btn.parentNode.querySelectorAll('button').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.color='';});
  btn.classList.add('on');
  btn.style.background=NT_TYPE==='sell'?'var(--green)':'var(--red)';btn.style.color='#fff';
  ntSyncBtn();
}
function ntRefresh(){
  const t=notesTot();
  const s=document.getElementById('nt-sum');if(s)s.innerHTML=ntSummary(t);
  const l=document.getElementById('nt-list');
  if(l)l.innerHTML=notesListHTML([...(DB.notes||[])].sort((a,b)=>b.date-a.date));
}
function ntCalc(){
  const w=+cleanNum(document.getElementById('nt-w').value)||0;
  const p=+cleanNum(document.getElementById('nt-p').value)||0;
  const el=document.getElementById('nt-calc');
  if(el)el.textContent=w&&p?('المجموع '+fmt(w*p,0)+' دج · '+fmt(w,2)+' غ'):'المجموع —';
}
function addNote(){
  const wEl=document.getElementById('nt-w'),pEl=document.getElementById('nt-p'),nEl=document.getElementById('nt-name');
  const w=+cleanNum(wEl.value)||0,p=+cleanNum(pEl.value)||0,name=cleanTxt(nEl.value);
  if(w<=0||p<=0)return toast('أدخل الوزن والسعر');
  if(NT_EDIT){
    const n=(DB.notes||[]).find(x=>x.id===NT_EDIT);
    if(n){n.type=NT_TYPE;n.name=name;n.weight=w;n.price=p;}
    NT_EDIT=null;logAct('ترباح','تعديل ترباح: '+(NT_TYPE==='sell'?'بيع':'شراء')+(name?' «'+name+'»':'')+' '+fmt(w,2)+' غ × '+fmt(p,0));save();renderHome();ntRefresh();ntResetForm();
    toast('حُفظ التعديل');return;
  }
  DB.notes.push({id:uid(),type:NT_TYPE,name,weight:w,price:p,date:Date.now()});
  logAct('ترباح','إضافة ترباح: '+(NT_TYPE==='sell'?'بيع':'شراء')+(name?' «'+name+'»':'')+' '+fmt(w,2)+' غ × '+fmt(p,0));save();renderHome();ntRefresh();ntResetForm();
  toast('أُضيف إلى '+(NT_TYPE==='sell'?'البيع':'الشراء'));
}
function ntResetForm(){
  const wEl=document.getElementById('nt-w'),pEl=document.getElementById('nt-p'),nEl=document.getElementById('nt-name');
  if(wEl)wEl.value='';if(pEl)pEl.value='';if(nEl)nEl.value='';
  ntCalc();ntSyncBtn();if(wEl)wEl.focus();
}
function ntSyncBtn(){
  const add=document.getElementById('nt-add');if(!add)return;
  if(NT_EDIT){add.textContent='حفظ التعديل';add.className='btn purple';}
  else{add.textContent='إضافة إلى '+(NT_TYPE==='sell'?'البيع':'الشراء');add.className='btn '+(NT_TYPE==='sell'?'gold':'primary');}
  const c=document.getElementById('nt-cancel');if(c)c.style.display=NT_EDIT?'block':'none';
}
function editNote(id){
  const n=(DB.notes||[]).find(x=>x.id===id);if(!n)return;
  NT_EDIT=id;NT_TYPE=n.type;
  document.getElementById('nt-w').value=digitsGroup(String(n.weight));
  document.getElementById('nt-p').value=digitsGroup(String(n.price));
  document.getElementById('nt-name').value=n.name||'';
  // تحديث أزرار النوع
  document.querySelectorAll('#nt-seg button').forEach(b=>{
    const on=b.dataset.t===NT_TYPE;b.classList.toggle('on',on);
    b.style.background=on?(NT_TYPE==='sell'?'var(--green)':'var(--red)'):'';
    b.style.color=on?'#fff':'';});
  ntCalc();ntSyncBtn();ntRefresh();
  const f=document.getElementById('nt-w');if(f){f.focus();f.scrollIntoView({behavior:'smooth',block:'center'});}
}
function ntCancelEdit(){NT_EDIT=null;ntRefresh();ntResetForm();toast('أُلغي التعديل');}
function delNote(id){
  if(NT_EDIT===id)NT_EDIT=null;
  const n=(DB.notes||[]).find(x=>x.id===id);if(n)toTrash('note',n);
  DB.notes=(DB.notes||[]).filter(n=>n.id!==id);
  if(n)logAct('حذف','حذف ترباح: '+(n.type==='sell'?'بيع':'شراء')+(n.name?' «'+n.name+'»':'')+' '+fmt(n.weight,2)+' غ × '+fmt(n.price,0));save();renderHome();ntRefresh();ntResetForm();toast('حُذف — في سلة المحذوفات');
}

/* ========= المصاريف ========= */
let EXPM='';
function openExpenses(){
  EXPM=EXPM||monthKey(Date.now());
  sheet('المصاريف',`
    <div style="background:var(--card);border-radius:var(--r-md);padding:15px;border:1px solid var(--line);box-shadow:var(--sh-sm);margin-bottom:14px">
      <div style="font-weight:900;font-size:14px;margin-bottom:11px">مصروف جديد</div>
      <input id="ex-amt" type="text" inputmode="decimal" placeholder="المبلغ بالدينار"
        style="width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg1);font-size:16px;font-weight:800;text-align:center;outline:none;margin-bottom:10px" oninput="onNum(this,exHint)">
      <input id="ex-why" placeholder="السبب (كهرباء، أجرة، نقل...)"
        style="width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg1);font-size:15px;font-weight:700;outline:none">
      <div id="ex-hint" style="text-align:center;font-size:12px;font-weight:800;margin-top:9px;color:var(--muted)">رصيد الكوفر ${fmt(coffer(),0)} دج</div>
      <div style="height:12px"></div>
      <button class="btn red" onclick="saveExpense()">تسجيل وخصم من الكوفر</button>
    </div>
    <div class="field" style="margin-bottom:12px"><label>فلترة بالشهر</label>
      <input type="month" id="ex-month" value="${EXPM}" onchange="EXPM=this.value;renderExpList()"></div>
    <div id="ex-list"></div>`);
  renderExpList();
}
function exHint(){
  const v=+cleanNum(document.getElementById('ex-amt').value)||0,cf=coffer(),h=document.getElementById('ex-hint');
  const over=v>cf+0.001;
  h.textContent=(over?'⚠️ ':'')+'رصيد الكوفر '+fmt(cf,0)+' دج';
  h.style.color=over?'var(--red)':'var(--muted)';
}
function saveExpense(){
  const v=+cleanNum(document.getElementById('ex-amt').value)||0;
  const w=cleanTxt(document.getElementById('ex-why').value);
  if(v<=0)return toast('أدخل المبلغ');
  if(!w)return toast('اكتب السبب');
  const cf=coffer();
  if(v>cf+0.001)return toast('رصيد الكوفر '+fmt(cf,0)+' دج فقط');
  DB.expenses.push({id:uid(),amount:v,reason:w,date:Date.now()});
  logAct('كوفر','مصروف «'+w+'» '+fmt(v,0)+' دج');save();renderHome();
  document.getElementById('ex-amt').value='';document.getElementById('ex-why').value='';
  EXPM=monthKey(Date.now());
  const mi=document.getElementById('ex-month');if(mi)mi.value=EXPM;
  renderExpList();exHint();toast('سُجّل المصروف — خُصم من الكوفر');
}
function renderExpList(){
  const el=document.getElementById('ex-list');if(!el)return;
  const list=DB.expenses.filter(e=>!EXPM||monthKey(e.date)===EXPM).sort((a,b)=>b.date-a.date);
  const tot=list.reduce((s,e)=>s+e.amount,0);
  let html=`<div class="netcard" style="padding:15px 8px;margin-bottom:12px">
    <div class="half"><div class="nl">عدد المصاريف</div><div class="nv num" style="font-size:21px;color:#dfe3ee">${list.length}</div></div>
    <div class="sep"></div>
    <div class="half"><div class="nl">المجموع</div><div class="nv num" style="font-size:21px;color:#ff8095">${fmt(tot,0)}</div></div></div>`;
  html+= !list.length? emptyBox('لا مصاريف في هذا الشهر','غيّر الشهر أو سجّل مصروفاً') :
    `<div class="tl">`+list.map(e=>`
      <div class="item"><div class="r1">
        <span class="badge" style="background:var(--red-soft);color:var(--red)">مصروف</span>
        <span class="dt">${new Date(e.date).toLocaleDateString('ar')}</span>
        <button class="cashdel" onclick="deleteExpense('${e.id}')">${ICON.trash}</button></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
          <span style="font-weight:800;font-size:14.5px">${e.reason}</span>
          <span class="num" style="margin-inline-start:auto;font-weight:900;font-size:16px;color:var(--red)">− ${fmt(e.amount,0)} دج</span>
        </div></div>`).join('')+`</div>`;
  el.innerHTML=html;
}
function deleteExpense(id){
  const e=DB.expenses.find(x=>x.id===id);if(!e)return;
  if(!confirm(`حذف مصروف «${e.reason}» بمبلغ ${fmt(e.amount,0)} دج؟\nسيرجع المبلغ إلى الكوفر.\nيُنقل إلى سلة المحذوفات ويمكن استرجاعه.`))return;
  toTrash('expense',e);
  DB.expenses=DB.expenses.filter(x=>x.id!==id);logAct('حذف','حذف مصروف «'+e.reason+'» '+fmt(e.amount,0)+' دج');save();renderHome();renderExpList();toast('حُذف المصروف — في سلة المحذوفات');
}

function saleFigs(){

function openSaleGold(){

        <div class="val num" style="color:var(--red)">${fmt(f.v3,2)}<span class="unit">غ</span></div>
        <div class="sub" style="color:#c47083">لا يُحسب ضمن ذهب البيع</div></div>
      ${f.v1>0.0005?priceyForm(f.v1):''}
      ${pricey.length?pricey.map(l=>saleLotCard(l,true)).join(''):`<div class="empty"><div class="eic">🔴</div><p>لا يوجد ذهب غالي</p><small>وسم دفعة بـ«غالي» لاستبعادها من البيع</small></div>`}
      ${back}`);
  }

/* ===== اقتراحات الأسماء (بديل datalist الذي لا يعمل جيداً في أندرويد) =====
   أي حقل له list="..." يُعرض تحته اقتراحات من قائمته وهو يكتب؛ الضغط على اسم يملأ الحقل ويطلق نفس أحداثه */
(function(){
  const norm=x=>String(x||'').trim().toLowerCase().replace(/ـ/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
  const eh=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let box=null,cur=null;
  const opts=inp=>{const dl=document.getElementById(inp.dataset.sugg);return dl?[...dl.options].map(o=>o.value).filter(Boolean):[];};
  function hide(){if(box){box.remove();box=null;}cur=null;}
  function place(inp){if(!box)return;const r=inp.getBoundingClientRect(),vh=(window.visualViewport?visualViewport.height:innerHeight);
    const below=vh-r.bottom-10,above=r.top-10,up=below<150&&above>below;
    box.style.left=r.left+'px';box.style.width=r.width+'px';
    if(up){box.style.top='';box.style.bottom=(innerHeight-r.top+4)+'px';box.style.maxHeight=Math.min(320,above)+'px';}
    else{box.style.bottom='';box.style.top=(r.bottom+4)+'px';box.style.maxHeight=Math.max(110,Math.min(320,below))+'px';}}
  function show(inp){
    const q=norm(inp.value);let list=opts(inp);
    if(q){list=list.filter(n=>norm(n).includes(q));list.sort((a,b)=>(norm(a).startsWith(q)?0:1)-(norm(b).startsWith(q)?0:1));}
    list=list.slice(0,8);
    if(!list.length||(list.length===1&&norm(list[0])===q)){hide();return;}
    if(!box){box=document.createElement('div');box.className='sugg';document.body.appendChild(box);}
    cur=inp;
    box.innerHTML=list.map(n=>{const i=q?norm(n).indexOf(q):-1;
      const label=i>=0&&norm(n).length===n.trim().length?eh(n.trim().slice(0,i))+'<b>'+eh(n.trim().slice(i,i+q.length))+'</b>'+eh(n.trim().slice(i+q.length)):eh(n);
      return `<button type="button" data-v="${eh(n)}">${label}</button>`;}).join('');
    place(inp);
  }
  const arm=t=>{if(t&&t.tagName==='INPUT'&&!t.dataset.sugg&&t.getAttribute('list')){t.dataset.sugg=t.getAttribute('list');t.removeAttribute('list');t.setAttribute('autocomplete','off');}return t&&t.dataset&&t.dataset.sugg;};
  document.addEventListener('focusin',e=>{if(arm(e.target))show(e.target);});
  document.addEventListener('input',e=>{if(e.target&&e.target.dataset&&e.target.dataset.sugg)show(e.target);});
  document.addEventListener('focusout',e=>{if(e.target===cur)setTimeout(()=>{if(document.activeElement!==cur)hide();},180);});
  document.addEventListener('pointerdown',e=>{
    const b=e.target.closest&&e.target.closest('.sugg button');
    if(!b){if(box&&!(e.target===cur))setTimeout(()=>{if(document.activeElement!==cur)hide();},180);return;}
    e.preventDefault();const inp=cur;if(!inp)return;
    inp.value=b.dataset.v;hide();
    inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));
  },true);
  if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(cur)place(cur);});
  window.addEventListener('scroll',()=>{if(cur)place(cur);},true);
  window._suggHide=hide;
})();

function navKey(e,kind){
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key))return;
  const map={inv:['ibody',3,appendInvRow],obc:['obc-body',3,appendOBcust],obi:['obi-body',2,appendOBing],obl:['obl-body',2,appendOBlot]};
  const [cid,cols,add]=map[kind];const cont=document.getElementById(cid);if(!cont)return;
  const r=+e.target.dataset.r,c=+e.target.dataset.c;
  const rowsCount=new Set([...cont.querySelectorAll('input[data-r]')].map(x=>x.dataset.r)).size;
  let nr=r,nc=c;
  if(e.key==='ArrowUp')nr=r-1;
  else if(e.key==='ArrowDown'||e.key==='Enter')nr=r+1;
  else if(e.key==='ArrowLeft')nc=c+1;
  else if(e.key==='ArrowRight')nc=c-1;
  if(nc<0){nc=cols-1;nr=r-1;} if(nc>=cols){nc=0;nr=r+1;}
  if(nr<0)return;
  e.preventDefault();
  if(nr>=rowsCount)add();
  setTimeout(()=>{const t=cont.querySelector(`input[data-r="${nr}"][data-c="${nc}"]`);if(t){t.focus();try{t.select()}catch(_){}}},0);
}

/* شبكة سبائك (وزن/عيار): أسهم في الاتجاهات الأربعة كالفاتورة. فوق السطر الأول ← خانة المبلغ */
function gridKey(e,cont,attr,rows,addRow,upId){
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key))return;
  const r=+e.target.dataset[attr],c=+e.target.dataset.c;let nr=r,nc=c;
  if(e.key==='ArrowUp')nr=r-1;else if(e.key==='ArrowDown'||e.key==='Enter')nr=r+1;
  else if(e.key==='ArrowLeft')nc=c+1;else nc=c-1;          // واجهة من اليمين لليسار: الوزن يمين والعيار يسار
  if(nc<0){nc=1;nr=r-1;}if(nc>1){nc=0;nr=r+1;}
  e.preventDefault();
  if(nr<0){const u=upId&&document.getElementById(upId);if(u){u.focus();try{u.select()}catch(_){}}return;}
  if(nr>=rows())addRow();
  setTimeout(()=>{const t=document.querySelector(`#${cont} input[data-${attr}="${nr}"][data-c="${nc}"]`);if(t){t.focus();try{t.select()}catch(_){}}},0);
}
function downToGrid(e,cont,attr){if(e.key!=='ArrowDown'&&e.key!=='Enter')return;
  const t=document.querySelector(`#${cont} input[data-${attr}="0"][data-c="0"]`);if(t){e.preventDefault();t.focus();try{t.select()}catch(_){}}}

  NCG=[{mizan:'',qoubal:''}];ncgRender();

/* ---- أسطر الذهب المتعددة ---- */
let NCG=[{mizan:'',qoubal:''}];
function ncgRowHTML(i){const r=NCG[i];
  return `<div style="display:flex;gap:9px;align-items:center;margin-bottom:8px">
    <input type="text" inputmode="decimal" data-g="${i}" data-c="0" placeholder="الوزن" value="${digitsGroup(r.mizan)}"
      onkeydown="ncgKey(event)" oninput="onNum(this,v=>ncgUpd(${i},'mizan',v))"
      style="flex:1;min-width:0;padding:14px;border-radius:12px;border:1.5px solid var(--gold-line);background:#fff;font-size:16px;font-weight:800;text-align:center;outline:none">
    <input type="text" inputmode="decimal" data-g="${i}" data-c="1" placeholder="العيار" value="${digitsGroup(r.qoubal)}"
      onkeydown="ncgKey(event)" oninput="onNum(this,v=>ncgUpd(${i},'qoubal',v))"
      style="flex:1;min-width:0;padding:14px;border-radius:12px;border:1.5px solid var(--gold-line);background:#fff;font-size:16px;font-weight:800;text-align:center;outline:none">
    <span style="min-width:74px;text-align:center;font-weight:800;font-size:12.5px;color:var(--gold-deep)" id="ncg-e${i}">—</span>
    ${true?`<button onclick="ncgDel(${i})" style="width:32px;height:32px;border-radius:10px;background:rgba(227,63,87,.1);color:var(--red);display:grid;place-items:center;flex:none">✕</button>`:''}
  </div>`;
}
function ncgRender(){
  const c=document.getElementById('nc-grows');if(!c)return;
  c.innerHTML=NCG.map((_,i)=>ncgRowHTML(i)).join('');
  NCG.forEach((_,i)=>ncgEqRow(i));
}
function ncgEqRow(i){
  const r=NCG[i],e=document.getElementById('ncg-e'+i);if(!e)return;
  const m=+cleanNum(r.mizan)||0,q=+cleanNum(r.qoubal)||0;
  e.textContent=(m&&q)?fmt(w730of(m,q),2):'—';
}
function ncgUpd(i,f,v){
  NCG[i][f]=v;ncgEqRow(i);
  // سطر جديد فقط بعد اكتمال الوزن والعيار — ولا إعادة رسم (تبقى لوحة المفاتيح مفتوحة)
  if(i===NCG.length-1&&String(NCG[i].mizan).trim()&&String(NCG[i].qoubal).trim()){
    NCG.push({mizan:'',qoubal:''});
    document.getElementById('nc-grows').insertAdjacentHTML('beforeend',ncgRowHTML(NCG.length-1));
  }
  ncEq();
}
function ncgDel(i){NCG.splice(i,1);if(!NCG.length)NCG=[{mizan:'',qoubal:''}];ncgRender();ncEq();}
function ncgKey(e){gridKey(e,'nc-grows','g',()=>NCG.length,()=>{NCG.push({mizan:'',qoubal:''});document.getElementById('nc-grows').insertAdjacentHTML('beforeend',ncgRowHTML(NCG.length-1));},'nc-dinar');}
function ncgList(){return NCG.filter(r=>(+cleanNum(r.mizan)||0)>0&&(+cleanNum(r.qoubal)||0)>0)
  .map(r=>({m:+cleanNum(r.mizan),q:+cleanNum(r.qoubal)}));}
window.pickDir=b=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');ncEq();};
function ncName(){
  const inp=document.getElementById('nc'),el=document.getElementById('nc-who');
  if(!inp||!el)return;
  const n=inp.value.trim();
  const c=DB.customers.find(x=>x.name.trim()===n);
  if(!c){el.textContent=n?'زبون جديد':'';el.style.color='var(--muted)';return;}
  const b=custBalance(c.id);
  const p=[];
  if(Math.abs(b.dinar)>=0.5)p.push(fmt(Math.abs(b.dinar),0)+' دج '+(b.dinar<0?'له':'عليه'));
  if(Math.abs(b.g730)>=0.005)p.push(fmt(Math.abs(b.g730),2)+' غ '+(b.g730<0?'له':'عليه'));
  el.textContent='زبون موجود — رصيده: '+(p.length?p.join(' · '):'صفر');
  el.style.color='var(--purple)';
}
function ncCheck(){ // يرجع نص الخطأ أو '' إن كان كل شيء سليماً
  const dv=+cleanNum(document.getElementById('nc-dinar').value)||0;
  const dKind=document.querySelector('#nc-ddir button.on')?.dataset.d||'take';
  const gKind=document.querySelector('#nc-gdir button.on')?.dataset.d||'take';
  if(dv>0&&dKind==='take'){
    const cf=coffer();
    if(cf<=0)return 'رصيد الكوفر صفر — لا يمكن الأخذ';
    if(dv>cf+0.001)return `رصيد الكوفر ${fmt(cf,0)} دج فقط`;
  }
  // سطر ناقص؟
  for(const r of NCG){
    const m=+cleanNum(r.mizan)||0,q=+cleanNum(r.qoubal)||0;
    if(m>0&&q<=0)return 'أدخل العيار في كل سطر';
    if(q>0&&m<=0)return 'أدخل الوزن في كل سطر';
  }
  // «أخذ» ذهباً: كل سبيكة يجب أن تطابق سبيكة موجودة فعلاً في ذهب الكوفر (نفس الوزن ونفس العيار)
  if(gKind==='take'){
    const pool=DB.stock.map(s=>({m:+s.mizan,q:+s.qoubal})),miss=[];
    ncgList().forEach(x=>{const i=pool.findIndex(p=>p.q===+x.q&&Math.abs(p.m-x.m)<0.005);
      if(i>=0)pool.splice(i,1);else miss.push(fmt(x.m,2)+'غ × '+x.q);});
    if(miss.length)return 'سبائك غير موجودة في ذهب الكوفر: '+miss.join('، ')+' — لإعطاء جزء من سبيكة استعمل زر «بيع» في ذهب الكوفر';
  }
  return '';
}
function ncEq(){
  const dv=+cleanNum(document.getElementById('nc-dinar').value)||0;
  const dKind=document.querySelector('#nc-ddir button.on')?.dataset.d||'take';
  const gKind=document.querySelector('#nc-gdir button.on')?.dataset.d||'take';

  const dh=document.getElementById('nc-dhint'),cf=coffer();
  if(dh){
    if(dKind==='take'){const over=dv>cf+0.001;
      dh.textContent=(over?'⚠️ ':'✓ ')+'رصيد الكوفر: '+fmt(cf,0)+' دج';
      dh.style.color=over?'var(--red)':'var(--green)';
    }else dh.textContent='';
  }

  const list=ncgList(),totEq=list.reduce((s,x)=>s+w730of(x.m,x.q),0);
  const eqEl=document.getElementById('nc-eq'),wEl=document.getElementById('nc-warn');
  if(eqEl)eqEl.textContent=list.length?(`${list.length} سبيكة · مكافئ 730 = ${fmt(totEq,2)} غ`):'—';
  const err=ncCheck();
  if(!wEl)return;
  if(err)wEl.innerHTML=`<div class="warn" style="margin-bottom:12px">⚠️ ${err}</div>`;
  else if(list.length&&gKind==='pay')wEl.innerHTML=dupBox(dupHits(list).hits);
  else if(list.length&&gKind==='take'){
    wEl.innerHTML=`<div style="text-align:center;color:var(--green);font-size:12px;font-weight:800;margin-bottom:12px">✓ ${list.length>1?'السبائك موجودة':'السبيكة موجودة'} في ذهب الكوفر</div>`;
  }else wEl.innerHTML='';
}
function saveCustomer(){
  const n=cleanTxt(document.getElementById('nc').value);
  if(!n)return toast('اكتب اسم الزبون');

  const phEl=document.getElementById('nc-phone'),pwEl=document.getElementById('nc-pass');
  const ph=phEl?phEl.value.trim():'',pw=pwEl?pwEl.value:'';
  if(ph||pw){
    if(!ph||!pw)return toast('للحساب: اكتب رقم الهاتف وكلمة السر معاً');
    if(!GPCLOUD.normUser(ph)||/[a-z]/i.test(ph))return toast('رقم الهاتف غير صحيح');
    if(pw.length<6)return toast('كلمة السر 6 أحرف على الأقل');
  }
  const err=ncCheck();
  if(err){ncEq();document.getElementById('nc-warn').scrollIntoView({behavior:'smooth',block:'center'});return toast(err);}

  const dv=+cleanNum(document.getElementById('nc-dinar').value)||0;
  const ings=ncgList();
  const dKind=document.querySelector('#nc-ddir button.on').dataset.d;
  const gKind=document.querySelector('#nc-gdir button.on').dataset.d;
  if(ings.some(x=>x.q>1000))return toast('عيار أكبر من 1000 — راجع العيار');
  if(gKind==='pay'&&ings.length&&!dupConfirm(ings))return;

  // «أخذ» = خرج منك (هو مدين لك) · «دفع» = دخل عندك (أنت مدين له)

  // زبون موجود؟ تُضاف المعاملة إلى حسابه بدل رفضه
  const exist=DB.customers.find(x=>x.name.trim()===n);
  const isNew=!exist;
  const c=exist||{id:uid(),name:n};
  if(isNew)DB.customers.push(c);
  else if(dv<=0&&!ings.length){save();closeModal();renderDebts();return toast('«'+n+'» موجود بالفعل');}

  const now=Date.now();let added=[];
  if(dv>0){
    DB.cash.push({id:uid(),customerId:c.id,kind:dKind,cur:'dinar',amount:dv,date:now});
    added.push((dKind==='take'?'أخذ ':'دفع ')+fmt(dv,0)+' دج');
  }
  ings.forEach(x=>{
    const eq=w730of(x.m,x.q);
    if(gKind==='pay')DB.stock.push({id:uid(),mizan:x.m,qoubal:x.q,w730:eq,source:'external',customerId:c.id,date:now});
    let snap=null;if(gKind==='take'){const ex=takeExact(x.q,x.m);if(ex)snap=JSON.parse(JSON.stringify(ex));else takeFromStock(x.q,x.m);}
    DB.cash.push({id:uid(),customerId:c.id,kind:gKind,cur:'730',mizan:x.m,qoubal:x.q,amount:eq,date:now,...(snap?{ingotSnap:snap}:{})});
  });
  if(ings.length)added.push((gKind==='take'?'أخذ ':'دفع ')+ings.length+' سبيكة · '+fmt(ings.reduce((s,x)=>s+w730of(x.m,x.q),0),2)+' غ');

  if(ph&&isNew)c.phone=GPCLOUD.normUser(ph);
  logAct('زبائن',(isNew?'زبون جديد «'+n+'»':'إضافة إلى «'+n+'»')+(added.length?' — '+added.join(' · '):''));save();closeModal();renderDebts();renderHome();
  toast(added.length?((isNew?'':'أُضيف إلى ')+n+' — '+added.join(' · ')):('أُضيف '+n));
  if(ph&&pw&&isNew)GPCLOUD.portalMake(c,ph,pw).then(m=>{toast(m?('⚠️ حُفظ الزبون لكن تعذّر إنشاء حسابه: '+m+' — أنشئه من بطاقة الزبون'):'✅ أُنشئ حساب الزبون — يدخل برقم هاتفه');try{renderDebts();}catch(e){}});
}

  sheet('شراء / بيع حساب — '+c.name,`

function qtCalc(){
  const w=+cleanNum(document.getElementById('qt-w').value)||0;
  const p=+cleanNum(document.getElementById('qt-p').value)||0;
  const tt=document.getElementById('qt-tot');if(tt)tt.textContent=fmt(w*p,0)+' دج';
  const g=custBalance(QT.cid).g730;
  const after=g+(QT.type==='buy'?w:-w);   // شراء يرفع الحساب (ينقص الأحمر)، بيع يخفضه
  const a=document.getElementById('qt-after');
  if(a){a.textContent=(after<0?'− ':'')+fmt(Math.abs(after),2)+' غ';
    a.style.color=Math.abs(after)<0.005?'#8b93b0':(after<0?'#ff8095':'#4fe0a0');}
}
function saveQuickTrade(){
  const cid=QT.cid,c=DB.customers.find(x=>x.id===cid);if(!c)return;
  const w=+cleanNum(document.getElementById('qt-w').value)||0;
  const p=+cleanNum(document.getElementById('qt-p').value)||0;
  if(w<=0)return toast('أدخل الوزن');
  const money=w*p;
  if(QT.settled&&QT.type==='buy'&&money>coffer()+0.5)return toast('رصيد الكوفر '+fmt(coffer(),0)+' دج فقط');
  const sid=uid(),now=Date.now();
  // شراء حساب بسعر = دفعة شراء مسعّرة (مثل فاتورة الشراء) · بيع حساب = يُخصَّص من الدفعات (يدخل الفائدة)
  const sAlloc=(QT.type==='sell'&&p>0)?autoAlloc(w):[];
  if(QT.type==='buy'&&p>0){const L={id:'S'+sid,w730:w,price:p,src:'settle',settleId:sid,customerId:cid,date:now};DB.lots.push(L);coverPending(L);}
  // جانب الذهب: يرفع الحساب في الشراء (take)، يخفضه في البيع (pay)
  DB.cash.push({id:uid(),customerId:cid,kind:QT.type==='buy'?'take':'pay',cur:'730',
    amount:w,note:'تسوية',settleId:sid,sType:QT.type,sSettled:QT.settled,sMoney:money,sAlloc,date:now,sNo:(DB.sCounter=(+DB.sCounter||0)+1)});
  if(money>0){
    if(QT.settled){
      // خالص: المبلغ يمرّ بالكوفر فقط، لا يمسّ رصيد الزبون (noBal)
      DB.cash.push({id:uid(),customerId:cid,kind:QT.type==='buy'?'take':'pay',cur:'dinar',
        amount:money,noBal:true,note:'تسوية',settleId:sid,date:Date.now()});
    }else{
      // غير خالص: المبلغ دين بالدينار على نفس الحساب، لا يمسّ الكوفر
      DB.openings.push({id:uid(),customerId:cid,dinar:QT.type==='buy'?-money:money,g730:0,
        note:'تسوية',settleId:sid,date:Date.now()});
    }
  }
  logAct('ديون',(QT.type==='buy'?'شراء حساب من «':'بيع حساب إلى «')+c.name+'»: '+fmt(w,2)+' غ × '+fmt(p,0)+' = '+fmt(money,0)+' دج — '+(QT.settled?'خالص':'غير خالص'));save();renderHome();renderDebts();openCustomer(cid);
  toast((QT.type==='buy'?'شراء ':'بيع ')+fmt(w,2)+'غ من الحساب — '+(QT.settled?'خالص':'غير خالص'));
}
function deleteSettle(sid,fromArch){
  const used=lotUsed('S'+sid);
  if(!confirm('حذف هذه التسوية؟ سيرجع الحساب كما كان قبلها.'+(used>0.0005?`\n⚠️ بِعت من ذهبها ${fmt(used,2)} غ — تُعاد فائدته بسعر الترباح أو تبقى بلا تكلفة.`:'')+'\nتُنقل إلى سلة المحذوفات ويمكن استرجاعها.'))return;
  let cid=null;
  toTrash('settle',{cash:(DB.cash||[]).filter(x=>x.settleId===sid),openings:(DB.openings||[]).filter(x=>x.settleId===sid),
    lots:(DB.lots||[]).filter(x=>x.settleId===sid)});
  DB.trash[0].links=lotLinks((DB.lots||[]).filter(x=>x.settleId===sid).map(x=>x.id));
  (DB.lots||[]).filter(x=>x.settleId===sid).forEach(x=>detachLot(x.id));
  DB.lots=(DB.lots||[]).filter(x=>x.settleId!==sid);
  (DB.cash||[]).forEach(x=>{if(x.settleId===sid)cid=x.customerId;});
  (DB.openings||[]).forEach(x=>{if(x.settleId===sid)cid=x.customerId;});
  DB.cash=(DB.cash||[]).filter(x=>x.settleId!==sid);
  DB.openings=(DB.openings||[]).filter(x=>x.settleId!==sid);
  logAct('حذف','حذف تسوية حساب «'+cn(cid)+'»');save();renderHome();renderDebts();if(fromArch){closeModal();try{renderArchiveList()}catch(e){}}else if(cid)openHistory(cid);toast('حُذفت التسوية — في سلة المحذوفات');
}

function autoFitRows(){ // يقيس الارتفاع الفعلي ويضبط عدد الأسطر
  if(!INV)return;
  const form=document.getElementById('invoice-form'),body=document.getElementById('ibody');
  if(!form||!body)return;
  const wide=window.innerWidth>=900;
  if(!wide&&document.body.classList.contains('inv-fs')){ // الهاتف بملء الشاشة: أسطر بقدر ارتفاع الجدول المرئي
    const rh=body.firstElementChild?body.firstElementChild.getBoundingClientRect().height:40;if(rh<10)return;
    const fit=Math.max(3,Math.floor(body.clientHeight/rh));
    const isEmpty=r=>!(String(r.mizan).trim()||String(r.qoubal).trim()||String(r.price).trim());
    while(INV.rows.length<fit&&INV.rows.length<25)appendInvRow();
    /* لا نحذف أسطراً هنا: ظهور لوحة المفاتيح يصغّر الشاشة وقد يكون السطر الأخير هو الذي تكتب فيه */
    return;}
  const margin=wide?18:96;              // مساحة أمان (والشريط السفلي في الهاتف)
  const rowH=body.firstElementChild?body.firstElementChild.getBoundingClientRect().height:46;
  if(rowH<10)return;
  const lastEmpty=()=>{const r=INV.rows[INV.rows.length-1];
    return !(String(r.mizan).trim()||String(r.qoubal).trim()||String(r.price).trim());};
  let guard=0;
  while(guard++<40){
    const space=window.innerHeight-margin-form.getBoundingClientRect().bottom;
    if(space<0){                         // يفيض → احذف سطراً فارغاً
      if(INV.rows.length<=3||!lastEmpty())break;
      INV.rows.pop();body.lastElementChild.remove();
    }else if(space>=rowH&&INV.rows.length<25){   // مساحة فارغة → أضف سطراً
      appendInvRow();
    }else break;
  }
}

function refreshTotals(){let m=0,g=0;INV.rows.forEach(r=>{const w=w730of(r.mizan,r.qoubal);g+=w;m+=w*(+cleanNum(r.price)||0)});INV.money=m;INV.total730=g;

    if(INV.taken>cf+0.001){
      INV.taken=Math.max(0,Math.floor(cf));

  }

  const invSign=INV.type==='buy'?-1:+1;
