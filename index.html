  const takenSign=INV.type==='buy'?+1:-1; // أخذ يرفع الرصيد · دفع يخفضه
  const paidEffect=INV.type==='buy'?-(INV.paid||0):0; // «دفع» في الشراء: دخل عندك فيخفض الرصيد (عكس أخذ)
  const finalSigned=INV.prevBalance+moneyEffect+takenSign*(INV.taken||0)+paidEffect;
  const fEl=document.getElementById('tfinal');fEl.textContent=fmt(Math.abs(finalSigned),0);shrinkFit(fEl,12);
  fEl.style.color=finalSigned>0.0001?'#4fe0a0':(finalSigned<-0.0001?'#ff8095':'#efb52f');}
function setType(t){INV.type=t;INV.taken=0;INV.paid=0;SH={target:'',mode:SH.mode,q:'all',res:null};renderInvoiceForm();}
function setPure(p){INV.settled=p;renderInvoiceForm();}
function taamim(){const f=INV.rows.find(r=>+r.price>0);if(!f)return toast('أدخل السعر في سطر أولاً');
  INV.rows.forEach(r=>{if(+r.mizan>0||+r.qoubal>0)r.price=f.price});renderRows();refreshTotals();toast('تم تعميم السعر');}
function applyInvoiceEffects(inv){
  if(inv.type==='buy'){
    inv.rows.forEach(r=>DB.stock.push({id:uid(),invId:inv.id,mizan:r.mizan,qoubal:r.qoubal,w730:r.w730,price:r.price||0,source:'external',customerId:inv.customerId,date:Date.now()}));
    if(inv.total730>0&&inv.money>0)
      {const L={id:'L'+inv.id,w730:inv.total730,price:inv.money/inv.total730,src:'invoice',invId:inv.id,no:inv.no,date:inv.date};
       DB.lots.push(L);coverPending(L);}
  }
  else{inv.rows.forEach(r=>{ // بيع من سبيكة محدّدة (زر بيع في ذهب الكوفر) — يُخصم منها هي ولو جزئياً
    const s=r.ingotId&&DB.stock.find(x=>x.id===r.ingotId&&+x.qoubal===+r.qoubal);
    if(s&&s.mizan+0.0005>=r.mizan){s.mizan-=r.mizan;s.w730=w730of(s.mizan,s.qoubal);if(s.mizan<=0.0001)DB.stock=DB.stock.filter(x=>x!==s);return;}
    // سطر عادي: تُحفظ هوية السبيكة المباعة حتى يعيدها الحذف/التعديل نفسها
    const ex=DB.stock.filter(x=>+x.qoubal===+r.qoubal&&Math.abs(x.mizan-r.mizan)<0.005).sort((a,b)=>(b.date||0)-(a.date||0))[0];
    if(ex){const {mizan,w730,...snap}=ex;r.fromSnap=snap;DB.stock=DB.stock.filter(x=>x!==ex);}
    else takeFromStock(r.qoubal,r.mizan);});}
  if((inv.taken||0)>0)DB.cash.push({id:uid(),invId:inv.id,customerId:inv.customerId,kind:inv.type==='buy'?'take':'pay',cur:'dinar',amount:inv.taken,date:Date.now()});
  if(inv.type==='buy'&&(inv.paid||0)>0)DB.cash.push({id:uid(),invId:inv.id,customerId:inv.customerId,kind:'pay',cur:'dinar',amount:inv.paid,date:Date.now()});
}
function buyIngotsMissing(inv){ // سطور فاتورة الشراء التي لم تعد سبائكها في ذهب الكوفر (بِيعت أو سُلّفت أو عُدّلت)
  const pool=DB.stock.filter(s=>s.invId===inv.id).map(s=>({q:+s.qoubal,m:+s.mizan})),miss=[];
  inv.rows.forEach(r=>{const e=pool.find(x=>x.q===+r.qoubal&&x.m+0.005>=+r.mizan);if(e)e.m-=+r.mizan;else miss.push(fmt(r.mizan,2)+'غ × '+r.qoubal);});
  return miss;}
function sameRows(a,b){ // نفس السبائك (الوزن والعيار) بغض النظر عن الترتيب والسعر
  const k=x=>x.map(r=>(+r.mizan).toFixed(3)+'×'+(+r.qoubal)).sort().join('|');return k(a)===k(b);}
function trimLot(id){ // دفعة صار وزنها أقل من المخصَّص منها: يُفكّ الزائد (الأحدث أولاً) ثم يُغطّى من دفعات أخرى
  const L=DB.lots.find(l=>l.id===id);let ex=lotUsed(id)-(L?L.w730:0);if(ex<=0.0005)return;
  sellOps().sort((a,b)=>b.date-a.date).forEach(o=>{if(ex<=0.0005)return;const arr=o.h[o.k]||[];const a=arr.find(x=>x.lotId===id);if(!a)return;
    const t=Math.min(a.g,ex);a.g-=t;ex-=t;if(a.g<=0.0005)o.h[o.k]=arr.filter(x=>x!==a);});
  DB.lots.filter(l=>!l.pricey&&lotRem(l)>0.0005).sort((a,b)=>(a.date||0)-(b.date||0)).forEach(l=>coverPending(l));}
function reverseInvoiceEffects(inv){ // يرجع نص تحذير إن نقص شيء
  let note='';
  if(inv.type==='buy'){
    inv.rows.forEach(r=>{
      let need=r.mizan;
      DB.stock.filter(s=>s.invId===inv.id&&+s.qoubal===+r.qoubal).forEach(s=>{if(need<=0)return;const t=Math.min(s.mizan,need);s.mizan-=t;s.w730=w730of(s.mizan,s.qoubal);need-=t;});
      DB.stock=DB.stock.filter(s=>s.mizan>0.0001);
      if(need>0.001){const got=takeFromStock(r.qoubal,need);if(need-got>0.001)note=`نقص ${fmt(need-got,2)} غ من العيار ${r.qoubal}`;}
    });
  }else{
    inv.rows.forEach(r=>{
      if(r.ingotId){ // يرجع الوزن إلى السبيكة نفسها
        const s=DB.stock.find(x=>x.id===r.ingotId);
        if(s){s.mizan+=r.mizan;s.w730=w730of(s.mizan,s.qoubal);return;}
        const o=r.ingotSnap||{};
        DB.stock.push({...o,id:r.ingotId,mizan:r.mizan,qoubal:r.qoubal,w730:r.w730,date:o.date||Date.now()});return;}
      if(r.fromSnap){const f=r.fromSnap;DB.stock.push({...f,id:DB.stock.some(x=>x.id===f.id)?uid():f.id,mizan:r.mizan,qoubal:r.qoubal,w730:w730of(r.mizan,r.qoubal)});delete r.fromSnap;return;}
      DB.stock.push({id:uid(),invId:'rev-'+inv.id,mizan:r.mizan,qoubal:r.qoubal,w730:r.w730,price:r.price||0,source:'external',customerId:inv.customerId,date:Date.now()});});
  }
  DB.cash=DB.cash.filter(x=>x.invId!==inv.id);
  DB.lots=(DB.lots||[]).filter(l=>l.invId!==inv.id);
  return note;
}
function stockShort(rows){ // السبائك المطلوبة للبيع وغير الموجودة فعلاً في ذهب الكوفر (يجب أن تطابق سبيكة حقيقية: نفس الميزان والعيار)
  const pool=DB.stock.map(x=>({id:x.id,m:+x.mizan,q:+x.qoubal})),miss=[];
  // أولاً: أسطر مرتبطة بسبيكة محدّدة (بيع جزء من زر «بيع») — يكفي أن يبقى في السبيكة وزن كافٍ
  rows.filter(r=>r.ingotId).forEach(r=>{const e=pool.find(x=>x.id===r.ingotId&&x.q===+r.qoubal);
    if(e&&e.m+0.0005>=+r.mizan)e.m-=+r.mizan;else miss.push(r);});
  // ثم: كل سطر عادي يجب أن يطابق سبيكة كاملة لم تُستعمل
  rows.filter(r=>!r.ingotId).forEach(r=>{const i=pool.findIndex(x=>x.q===+r.qoubal&&Math.abs(x.m-(+r.mizan))<0.005);
    if(i>=0)pool.splice(i,1);else miss.push(r);});
  return miss.map(r=>fmt(+r.mizan,2)+'غ × '+r.qoubal);
}
const NOSTOCK_MSG=m=>'سبائك غير موجودة في ذهب الكوفر: '+m.join('، ')+' — لبيع جزء من سبيكة استعمل زر «بيع» في ذهب الكوفر';
function saveInvoice(){
  if(!(INV.customerName||'').trim())return toast('اكتب اسم الزبون');
  const rows=INV.rows.filter(r=>+r.mizan>0&&+r.qoubal>0).map(r=>({mizan:+r.mizan,qoubal:+r.qoubal,price:+r.price||0,w730:w730of(r.mizan,r.qoubal),total:w730of(r.mizan,r.qoubal)*(+r.price||0),
    ...(r.ingotId&&INV.type==='sell'?{ingotId:r.ingotId,ingotSnap:r.ingotSnap}:{})}));
  if(!rows.length)return toast('أضف سطراً واحداً على الأقل');
  if(rows.some(r=>r.qoubal>1000))return toast('عيار أكبر من 1000 — راجع العيار');
  if(rows.some(r=>r.price<0))return toast('السعر لا يكون سالباً');
  const rawP=INV.rows.filter(r=>+r.mizan>0&&+r.qoubal>0).map(r=>String(r.price||''));
  const amb=rawP.find(x=>/\.\d{3}$/.test(x));
  if(amb&&!confirm('السعر «'+amb+'» فيه 3 أرقام بعد النقطة.\nهل تقصد '+digitsGroup(String(Math.round(+amb*1000)))+' ؟\n\nموافق = متابعة بالسعر كما هو ('+amb+') · إلغاء = الرجوع للتصحيح'))return;
  if(rows.some(r=>!(r.price>0))&&!confirm('يوجد سطر بلا سعر (السعر 0).\nهل تريد المتابعة؟'))return;
  if(!INV.editId&&INV.type==='buy'&&INV.settled){const out=rows.reduce((t,r)=>t+r.total,0)+(INV.taken||0)-(INV.paid||0);
    if(out>coffer()+0.5)return toast('فاتورة خالصة: رصيد الكوفر '+fmt(coffer(),0)+' دج فقط');}
  if(INV.type==='buy'&&!dupConfirm(rows.map(r=>({m:r.mizan,q:r.qoubal})),INV.editId?(x=>x.invId===INV.editId):null))return;
  const wEl=document.getElementById('sell-warn');wEl.innerHTML='';
  const warn=t=>{wEl.innerHTML=`<div class="warn">⚠️ ${t}</div>`;wEl.scrollIntoView({behavior:'smooth'});};

  if(INV.editId){ // ===== تعديل فاتورة من الأرشيف: نافذة السبب أولاً، ولا يُمسّ المخزون قبل التأكيد =====
    const old=DB.invoices.find(x=>x.id===INV.editId);if(!old)return toast('الفاتورة غير موجودة');
    pendingEdit={old,rows};
    openEditReason();return;
  }

  if(INV.type==='sell'){const short=stockShort(rows);if(short.length)return warn(NOSTOCK_MSG(short));}
  const total730=rows.reduce((s,r)=>s+r.w730,0);
  if(INV.type==='sell'&&lotsAvail().length&&rows.reduce((t,r)=>t+r.total,0)>0){
    finishSave(rows,autoAlloc(total730));return;
  }
  finishSave(rows,[]);
}
function finishSave(rows,alloc){
  const c=findOrCreateCustomer(INV.customerName);
  const money=rows.reduce((s,r)=>s+r.total,0),total730=rows.reduce((s,r)=>s+r.w730,0);
  const inv={id:uid(),no:DB.counter+1,customerId:c.id,type:INV.type,settled:INV.settled,rows,money,total730,
    taken:INV.taken||0,paid:INV.paid||0,prevBalance:INV.prevBalance,date:Date.now(),edits:[],alloc:alloc||[],

  DB.counter++;DB.invoices.push(inv);logAct('فواتير',invLogText(inv));save();toast('تم حفظ الفاتورة N°'+inv.no);newInvoice();renderHome();renderDebts();
}

let pendingEdit=null;
const EDIT_REASONS=['خطأ في الوزن','خطأ في العيار','خطأ في السعر','إرجاع سبيكة'];

function openEditReason(){
  sheet('سبب التعديل',`
    <p style="color:var(--muted);font-weight:700;font-size:13px;margin:2px 4px 16px;line-height:1.7">اختر سبباً واحداً أو أكثر لتوثيق التعديل في سجل الفاتورة.</p>

function toggleReason(el){
  const on=el.dataset.on==='1';el.dataset.on=on?'':'1';
  const b=el.querySelector('.rsbox');
  b.style.background=on?'transparent':'var(--purple)';
  b.style.borderColor=on?'var(--line)':'var(--purple)';

function cancelEdit(){pendingEdit=null;closeModal();toast('أُلغي التعديل');}
function confirmEdit(){
  const picked=[...document.querySelectorAll('.rsn')].filter(x=>x.dataset.on==='1').map(x=>EDIT_REASONS[+x.dataset.i]);
  if(!picked.length)return toast('اختر سبب التعديل');
  const note=cleanTxt(document.getElementById('rs-note').value);
  const {old,rows}=pendingEdit;
  const fail=(msg,t)=>{closeModal();const wEl=document.getElementById('sell-warn');
    if(wEl){wEl.innerHTML=`<div class="warn">⚠️ ${msg}</div>`;wEl.scrollIntoView({behavior:'smooth'});}pendingEdit=null;return toast(t);};
  if(old.type==='buy'){
    // تعديل خفيف: نفس السبائك (السعر/الحالة/الزبون/أخذ-دفع فقط) — لا يُمسّ المخزون
    if(INV.type==='buy'&&sameRows(old.rows,rows)){
      const c0=findOrCreateCustomer(INV.customerName);
      DB.cash=DB.cash.filter(x=>x.invId!==old.id);
      DB.stock.forEach(s=>{if(s.invId===old.id){const r=rows.find(r=>+r.qoubal===+s.qoubal);if(r)s.price=r.price;s.customerId=c0.id;}});
      old.customerId=c0.id;old.settled=INV.settled;old.rows=rows;
      old.money=rows.reduce((t,r)=>t+r.total,0);old.total730=rows.reduce((t,r)=>t+r.w730,0);
      old.taken=INV.taken||0;old.paid=INV.paid||0;old.prevBalance=INV.prevBalance;
      old.edits=old.edits||[];old.edits.push({at:Date.now(),reasons:picked,note});
      if((old.taken||0)>0)DB.cash.push({id:uid(),invId:old.id,customerId:old.customerId,kind:'take',cur:'dinar',amount:old.taken,date:Date.now()});
      if((old.paid||0)>0)DB.cash.push({id:uid(),invId:old.id,customerId:old.customerId,kind:'pay',cur:'dinar',amount:old.paid,date:Date.now()});
      const L=DB.lots.find(l=>l.id==='L'+old.id);
      if(L){if(old.money>0)L.price=old.money/old.total730;}
      else if(old.money>0&&old.total730>0){const nl={id:'L'+old.id,w730:old.total730,price:old.money/old.total730,src:'invoice',invId:old.id,no:old.no,date:old.date};DB.lots.push(nl);coverPending(nl);}
      pendingEdit=null;logAct('فواتير','تعديل '+invLogText(old)+' — السبب: '+picked.join('، ')+(note?' ('+note+')':''));save();closeModal();
      INV=null;newInvoice();go('archive');renderHome();renderDebts();
      return toast('عُدّلت الفاتورة N°'+old.no);
    }
    const miss=buyIngotsMissing(old);
    if(miss.length)return fail('لا يمكن تغيير أوزان أو نوع الفاتورة N°'+old.no+' — سبائكها لم تعد في ذهب الكوفر: '+miss.join('، ')+' · يمكنك تعديل السعر أو الحالة فقط','تعذّر التعديل — سبائك الفاتورة بِيعت');
  }
  // نسخة أمان كاملة قبل أي تعديل
  const snap=JSON.stringify(DB),oldRows=old.rows.map(r=>({...r})),oldType=old.type;
  const revNote=reverseInvoiceEffects(old);
  if(INV.type==='sell'){
    const short=stockShort(rows);
    if(short.length){DB=JSON.parse(snap);
      closeModal();
      const wEl=document.getElementById('sell-warn');
      if(wEl){wEl.innerHTML=`<div class="warn">⚠️ ${NOSTOCK_MSG(short)}</div>`;wEl.scrollIntoView({behavior:'smooth'});}
      pendingEdit=null;return toast('تعذّر التعديل — سبيكة غير موجودة في ذهب الكوفر');}
  }
  const c=findOrCreateCustomer(INV.customerName);
  const doApply=alloc=>{
    old.customerId=c.id;old.type=INV.type;old.settled=INV.settled;old.rows=rows;
    old.money=rows.reduce((s,r)=>s+r.total,0);old.total730=rows.reduce((s,r)=>s+r.w730,0);
    old.taken=INV.taken||0;old.paid=INV.paid||0;old.prevBalance=INV.prevBalance;old.alloc=alloc||[];
    old.edits=old.edits||[];old.edits.push({at:Date.now(),reasons:picked,note});
    applyInvoiceEffects(old);
    if(old.type==='buy')trimLot('L'+old.id);
    pendingEdit=null;logAct('فواتير','تعديل '+invLogText(old)+' — السبب: '+picked.join('، ')+(note?' ('+note+')':''));save();closeModal();
    INV=null;newInvoice();go('archive');renderHome();renderDebts();
    toast(revNote?('عُدّلت — '+revNote):('عُدّلت الفاتورة N°'+old.no));
  };
  if(INV.type==='sell'){
    const t730=rows.reduce((s,r)=>s+r.w730,0);
    const prev=(old.alloc||[]).slice();old.alloc=[]; // بعد التفريغ صار المتاح يشمل ما كان مخصَّصاً لها — لا يُضاف مرة ثانية
    if(rows.reduce((t,r)=>t+r.total,0)>0){
      if(oldType==='sell'&&sameRows(oldRows,rows)&&allocFits(prev)){doApply(prev);return;} // نفس السبائك: يبقى التخصيص كما هو
      if(lotsAvail().length){doApply(autoAlloc(t730));return;}}
  }
  doApply([]);
}

        oninput="onNum(this,v=>SH.target=v)" onkeydown="if(event.key==='Enter'){event.preventDefault();suggestSell()}"
        style="flex:1;min-width:0;padding:10px;border-radius:11px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-size:15.5px;font-weight:800;text-align:center;outline:none;direction:ltr">
      <button onclick="suggestSell()" style="padding:10px 15px;border-radius:11px;background:linear-gradient(135deg,#f4c645,#df9310);color:#3a2a04;font-weight:800;font-size:13.5px;white-space:nowrap">اقترح</button>
    </div>
    <div id="sh-res">${SH.res?shResHTML():''}</div></div>`;
}
function suggestSell(){
  const box=document.getElementById('sh-res');
  const t=+cleanNum(SH.target||'');
  if(!t||t<=0){SH.res=null;box.innerHTML=`<div style="color:#ff8095;font-weight:800;font-size:12.5px;margin-top:10px;text-align:center">أدخل الوزن</div>`;return;}
  let pool=DB.stock.map(s=>({id:s.id,mizan:s.mizan,qoubal:+s.qoubal,w730:s.w730}));
  pool.sort((a,b)=>b.w730-a.w730);
  const chosen=[];let rem=t;
  pool.forEach(s=>{if(s.w730<=rem+1e-9&&s.w730>0){chosen.push({...s,take:s.mizan,partial:false});rem-=s.w730;}});
  if(rem>0.005){
    const used=new Set(chosen.map(c=>c.id));
    const left=pool.filter(s=>!used.has(s.id)).sort((a,b)=>a.w730-b.w730);
    if(left.length){const s=left[0];const take=Math.min(s.mizan,rem*730/s.qoubal);
      chosen.push({...s,take,partial:take<s.mizan-1e-9});rem-=w730of(take,s.qoubal);}
  }
  SH.res={chosen,rem,target:t};box.innerHTML=shResHTML();
}
function shResHTML(){
  const {chosen,target}=SH.res;
  if(!chosen.length)return `<div style="color:#ff8095;font-weight:800;font-size:12.5px;margin-top:10px;text-align:center">لا توجد سبائك</div>`;
  const tot=chosen.reduce((s,c)=>s+w730of(c.take,c.qoubal),0),diff=tot-target;
  return `<div style="margin-top:11px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px">
    ${chosen.map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(255,255,255,.06);border-radius:10px;margin-bottom:6px;font-size:13.5px">
      <span style="color:#fff;font-weight:900;direction:ltr">${fmt(c.take,2)} غ</span>
      <span style="color:var(--gold);font-weight:800;font-size:12px">عيار ${c.qoubal}</span>
      ${c.partial?'<span style="color:#8e97b8;font-size:10px;font-weight:800">جزئية</span>':''}
      <span style="margin-inline-start:auto;color:#8e97b8;font-weight:800;font-size:12px;direction:ltr">${fmt(w730of(c.take,c.qoubal),2)}</span></div>`).join('')}
    <div style="display:flex;gap:8px;margin:9px 0;font-size:12px;font-weight:800">
      <span style="color:#8e97b8">المجموع <b style="color:#fff;direction:ltr">${fmt(tot,2)}</b></span>
      <span style="margin-inline-start:auto;color:${Math.abs(diff)<0.01?'#4fe0a0':'#efb52f'}">${Math.abs(diff)<0.01?'مطابق':(diff>0?'زيادة ':'نقص ')+fmt(Math.abs(diff),2)}</span></div>
    <button onclick="applySuggestion()" style="width:100%;padding:11px;border-radius:11px;background:linear-gradient(135deg,#f4c645,#df9310);color:#3a2a04;font-weight:900;font-size:13.5px">املأ الفاتورة</button></div>`;
}
function applySuggestion(){
  if(!SH.res||!SH.res.chosen.length)return;
  const price=(INV.rows.find(r=>+cleanNum(r.price)>0)||{}).price||'';
  INV.rows=SH.res.chosen.map(c=>({mizan:String(Math.round(c.take*1000)/1000),qoubal:String(c.qoubal),price}));
  INV.rows.push(emptyRow());
  renderRows();refreshTotals();toast('تم ملء الفاتورة');
  document.getElementById('ibody').scrollIntoView({behavior:'smooth',block:'center'});
}

let ALLOC=null;
function openAllocPicker(needG,existing,onDone){
  const av=lotsAvail().map(l=>({...l}));
  (existing||[]).forEach(a=>{const l=av.find(x=>x.id===a.lotId);
    if(l)l.rem+=a.g; else{const src=(DB.lots||[]).find(x=>x.id===a.lotId);if(src)av.push({...src,rem:a.g});}});
  if(!av.length){onDone([]);return;}

}
function renderAlloc(){

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">

          <span class="num" style="margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:800">متاح ${fmt(l.rem,2)} غ</span></div>
        <div style="display:flex;gap:8px">
          <input type="text" inputmode="decimal" value="${digitsGroup(String(A.vals[l.id]?Math.round(A.vals[l.id]*1000)/1000:''))}" placeholder="0"
            oninput="onNum(this,v=>allocSet('${l.id}',v,${l.rem}))"
            style="flex:1;min-width:0;padding:12px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg1);font-size:15px;font-weight:800;text-align:center;outline:none">

function allocSet(id,v,max){
  let x=+cleanNum(String(v))||0;
  if(x>max){x=max;toast('المتاح '+fmt(max,2)+' غ فقط');}
  ALLOC.vals[id]=x;
  const used=Object.values(ALLOC.vals).reduce((s,v)=>s+(+v||0),0),left=ALLOC.need-used;
  const hs=document.querySelectorAll('.overlay .netcard .half .nv');
  if(hs[1])hs[1].textContent=fmt(used,2);
  if(hs[2]){hs[2].textContent=fmt(Math.abs(left),2);
    hs[2].style.color=Math.abs(left)<0.0005?'#4fe0a0':(left<0?'#ff8095':'#ffd479');}
}
function allocFill(id,max){ALLOC.vals[id]=max;renderAlloc();}
function allocDone(){
  const A=ALLOC,used=Object.values(A.vals).reduce((s,v)=>s+(+v||0),0);
  if(used>A.need+0.0005)return toast('المخصَّص أكبر من الوزن المباع');
  const alloc=Object.keys(A.vals).filter(k=>A.vals[k]>0.0005).map(k=>({lotId:k,g:A.vals[k]}));
  const cb=A.onDone;ALLOC=null;closeModal();cb(alloc);
}

let STQ='',STDUP=false,STOPEN=null;
function dupCounts(){const c={};DB.stock.forEach(x=>{const k=ingKey(x.mizan,x.qoubal);c[k]=(c[k]||0)+1;});return c;}
function openStock(){
  const tot=DB.stock.reduce((a,s)=>a+s.w730,0);

function renderStockList(){

  const dc=dupCounts(),isDup=s=>dc[ingKey(s.mizan,s.qoubal)]>1;
  const nd=DB.stock.filter(isDup).length;if(!nd)STDUP=false;
  const db=document.getElementById('stock-dup');
  if(db)db.innerHTML=nd?`<button onclick="STDUP=!STDUP;renderStockList()" style="width:100%;margin-bottom:14px;padding:13px;border-radius:13px;font-weight:800;font-size:14px;

  let list=[...DB.stock].sort((a,b)=>(b.qoubal-a.qoubal)||(b.mizan-a.mizan));

  if(!list.length){el.innerHTML=`<div class="empty"><div class="eic">${ICON.coin}</div>

  const sub=list.reduce((a,s)=>a+s.w730,0);
  el.innerHTML=(q?`<div style="text-align:center;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:12px">
      ${fmt(list.length,0)} سبيكة · ${fmt(sub,2)} غ (730)</div>`:'')

function doSplit(id){
  const s=DB.stock.find(x=>x.id===id);if(!s)return;
  const m1=+cleanNum(document.getElementById('sp-m').value)||0;
  if(m1<=0)return toast('أدخل وزن القطعة الأولى');
  if(m1>=s.mizan)return toast('وزن القطعة أكبر من السبيكة — استعمل وزناً أصغر');
  const m2=+(s.mizan-m1).toFixed(3),q=+s.qoubal;
  if(!confirm('تقسيم '+fmt(s.mizan,2)+'غ عيار '+q+' إلى:\n• '+fmt(m1,2)+'غ\n• '+fmt(m2,2)+'غ\n\nالوزن الإجمالي لا يتغيّر. يمكن التراجع من سلة المحذوفات.'))return;
  const orig=JSON.parse(JSON.stringify(s));
  const base={qoubal:q,source:s.source||'external'};
  if(s.price>0)base.price=s.price;if(s.customerId)base.customerId=s.customerId;if(s.invId)base.invId=s.invId;
  const a={id:uid(),mizan:+m1.toFixed(3),w730:w730of(m1,q),...base,date:Date.now()};
  const b={id:uid(),mizan:m2,w730:w730of(m2,q),...base,date:Date.now()};
  DB.stock=DB.stock.filter(x=>x!==s);DB.stock.push(a,b);
  toTrash('stockSplit',{orig,ids:[a.id,b.id],qoubal:q,m1:+m1.toFixed(3),m2});
  logAct('ذهب','تقسيم سبيكة عيار '+q+': '+fmt(orig.mizan,2)+'غ ← '+fmt(m1,2)+'غ + '+fmt(m2,2)+'غ');
  save();renderHome();openStock();toast('قُسّمت السبيكة — '+fmt(m1,2)+'غ + '+fmt(m2,2)+'غ');
}

function doMerge(aid,bid){
  const a=DB.stock.find(x=>x.id===aid),b=DB.stock.find(x=>x.id===bid);if(!a||!b||a===b)return;
  if(+a.qoubal!==+b.qoubal)return toast('العياران مختلفان');
  if(!confirm('دمج '+fmt(a.mizan,2)+'غ + '+fmt(b.mizan,2)+'غ = '+fmt(a.mizan+b.mizan,2)+'غ عيار '+a.qoubal+'؟\nالوزن الإجمالي لا يتغيّر. يمكن التراجع من سلة المحذوفات.'))return;
  const parts=[JSON.parse(JSON.stringify(a)),JSON.parse(JSON.stringify(b))];
  const m=+(a.mizan+b.mizan).toFixed(3),tot=a.mizan+b.mizan;
  const merged={id:uid(),mizan:m,qoubal:+a.qoubal,w730:w730of(m,a.qoubal),source:a.source||b.source||'external',date:Date.now()};
  if((+a.price||0)>0||(+b.price||0)>0)merged.price=((+a.price||0)*a.mizan+(+b.price||0)*b.mizan)/tot;
  if(a.customerId||b.customerId)merged.customerId=a.customerId||b.customerId;
  DB.stock=DB.stock.filter(x=>x!==a&&x!==b);DB.stock.push(merged);
  toTrash('stockMerge',{parts,mergedId:merged.id,mizan:m,qoubal:+a.qoubal});
  logAct('ذهب','دمج سبيكتين عيار '+a.qoubal+': '+fmt(parts[0].mizan,2)+'غ + '+fmt(parts[1].mizan,2)+'غ = '+fmt(m,2)+'غ');
  save();renderHome();openStock();toast('دُمجت السبيكتان — '+fmt(m,2)+'غ');
}

function siCalc(id){

function saveIngotSale(id){
  const s=DB.stock.find(x=>x.id===id);if(!s)return toast('السبيكة غير موجودة');
  const name=(document.getElementById('si-n').value||'').trim();
  let w=+cleanNum(document.getElementById('si-w').value)||0;const p=+cleanNum(document.getElementById('si-p').value)||0;
  if(!name)return toast('اكتب اسم الزبون');
  if(w<=0)return toast('أدخل الوزن');
  if(w>s.mizan+0.005)return toast('الوزن أكبر من السبيكة ('+fmt(s.mizan,2)+' غ)');
  if(Math.abs(w-s.mizan)<0.005)w=s.mizan; // السبيكة كاملة (لا تبقى فتات)
  if(p<=0)return toast('أدخل السعر');
  const c=findOrCreateCustomer(name);
  const g=w730of(w,s.qoubal);
  const snap={source:s.source,customerId:s.customerId,price:s.price,invId:s.invId,date:s.date};
  const row={mizan:+w.toFixed(4),qoubal:+s.qoubal,price:p,w730:g,total:g*p,ingotId:s.id,ingotSnap:snap};
  const inv={id:uid(),no:DB.counter+1,customerId:c.id,type:'sell',settled:SI.settled,rows:[row],money:row.total,total730:g,
    taken:0,paid:0,prevBalance:custBalance(c.id).dinar,date:Date.now(),edits:[],alloc:lotsAvail().length?autoAlloc(g):[]};
  applyInvoiceEffects(inv);
  DB.counter++;DB.invoices.push(inv);logAct('فواتير','بيع من ذهب الكوفر — '+invLogText(inv));save();
  renderHome();renderDebts();try{renderArchive();}catch(e){}
  openStock();

const qn=(v,d=0)=>'<b dir="ltr" class="num" style="unicode-bidi:isolate;display:inline-block">'+grp(v,d)+'</b>'; // رقم معزول الاتجاه

/* سبائك 730 في بطاقتي أخذت/دفعت — نفس قيود «إضافة» في بطاقة الزبون */
let QCG=[{mizan:'',qoubal:''}];
function qcgRowHTML(i,dir){const r=QCG[i];
  const inp=(c,f,ph)=>`<input type="text" inputmode="decimal" data-qg="${i}" data-c="${c}" placeholder="${ph}" value="${digitsGroup(r[f])}"

  return `<div style="display:flex;gap:7px;align-items:center;margin-bottom:7px">${inp(0,'mizan','الوزن')}${inp(1,'qoubal','العيار')}

    ${true?`<button onclick="qcgDel(${i},'${dir}')" style="width:30px;height:30px;border-radius:9px;border:none;background:var(--bg2);color:var(--muted);font-weight:900;flex:none">×</button>`:''}</div>`;}
function qcgRender(dir){const c=document.getElementById('qc-grows');if(!c)return;
  c.innerHTML=QCG.map((_,i)=>qcgRowHTML(i,dir)).join('');QCG.forEach((_,i)=>qcgEqRow(i));}
function qcgEqRow(i){const r=QCG[i],e=document.getElementById('qcg-e'+i);if(!e)return;
  const m=+cleanNum(r.mizan)||0,q=+cleanNum(r.qoubal)||0;e.textContent=(m&&q)?fmt(w730of(m,q),2):'—';}
function qcgUpd(i,f,v,dir){QCG[i][f]=v;qcgEqRow(i);
  if(i===QCG.length-1&&String(QCG[i].mizan).trim()&&String(QCG[i].qoubal).trim()){   // سطر جديد بعد الوزن والعيار معاً، بلا إعادة رسم
    QCG.push({mizan:'',qoubal:''});document.getElementById('qc-grows').insertAdjacentHTML('beforeend',qcgRowHTML(QCG.length-1,dir));}
  qcHint(dir);}
function qcgDel(i,dir){QCG.splice(i,1);if(!QCG.length)QCG=[{mizan:'',qoubal:''}];qcgRender(dir);qcHint(dir);}
function qcgKey(e,dir){gridKey(e,'qc-grows','qg',()=>QCG.length,()=>{QCG.push({mizan:'',qoubal:''});document.getElementById('qc-grows').insertAdjacentHTML('beforeend',qcgRowHTML(QCG.length-1,dir));},'qc-a');}
function qcgList(){return QCG.filter(r=>(+cleanNum(r.mizan)||0)>0&&(+cleanNum(r.qoubal)||0)>0).map(r=>({m:+cleanNum(r.mizan),q:+cleanNum(r.qoubal)}));}
function qcgCheck(dir){ // نص الخطأ أو ''
  for(const r of QCG){const m=+cleanNum(r.mizan)||0,q=+cleanNum(r.qoubal)||0;
    if(m>0&&q<=0)return 'أدخل العيار في كل سطر';if(q>0&&m<=0)return 'أدخل الوزن في كل سطر';if(q>1000)return 'عيار أكبر من 1000 — راجع العيار';}
  if(dir==='out'){ // حارس: كل سبيكة يجب أن تطابق سبيكة موجودة في ذهب الكوفر (نفس الوزن ونفس العيار)
    const pool=DB.stock.map(s=>({m:+s.mizan,q:+s.qoubal})),miss=[];
    qcgList().forEach(x=>{const i=pool.findIndex(p=>p.q===+x.q&&Math.abs(p.m-x.m)<0.005);if(i>=0)pool.splice(i,1);else miss.push(fmt(x.m,2)+'غ × '+x.q);});
    if(miss.length)return 'غير موجودة في ذهب الكوفر: '+miss.join('، ');}

function qcHint(dir){

function saveQuickCash(dir){

  save();closeModal();renderHome();try{renderDebts();}catch(e){}
  toast((isIn?'✓ أخذت ':'✓ دفعت ')+parts.join(' · ')+' — '+c.name);
}

/* ========= الحذف مع عكس الأثر ========= */
function scatterFix(d){ // يعيد بناء تقسيم سبائك أي عيار تشتّت، فقط عند وجود حلّ وحيد مؤكّد — لا يغيّر الوزن الإجمالي
  const near=(a,b)=>Math.abs(a-b)<0.03;let fixed=0;
  const incByQ={};const addI=(q,m,meta)=>{(incByQ[q]=incByQ[q]||[]).push({m:+m,meta});};
  (d.ingLog||[]).forEach(x=>addI(+x.qoubal,+x.mizan,{source:'mine'}));
  (d.invoices||[]).filter(i=>i.type==='buy').forEach(i=>(i.rows||[]).forEach(r=>addI(+r.qoubal,+r.mizan,{source:'external',invId:i.id,customerId:i.customerId,price:+r.price||0})));
  (d.cash||[]).filter(c=>c.cur==='730'&&c.kind==='pay'&&c.note!=='تسوية'&&+c.mizan>0).forEach(c=>addI(+c.qoubal,+c.mizan,{source:'external',customerId:c.customerId}));
  const subs=(arr,target)=>{const sols=[];const n=arr.length;
    const rec=(i,cur,sum)=>{if(sols.length>=6)return;if(Math.abs(sum-target)<0.03){sols.push(cur.slice());return;}if(i>=n||sum-target>0.03)return;rec(i+1,cur.concat(i),sum+arr[i]);rec(i+1,cur,sum);};
    rec(0,[],0);return sols;};
  Object.keys(incByQ).forEach(qk=>{const q=+qk;const S=d.stock.filter(s=>+s.qoubal===q);
    if(S.length<1||S.length>24)return;
    if(S.some(s=>String(s.invId||'').startsWith('rev-')))return; // سبائك من انعكاس بيع — لا تُلمس
    const I=incByQ[q];if(I.length<1||I.length>24)return;
    const sumS=S.reduce((a,s)=>a+s.mizan,0),sumI=I.reduce((a,x)=>a+x.m,0),sold=sumI-sumS;
    if(sold<-0.03)return; // ذهب زائد عن الداخل — لا يُلمس تلقائياً
    const sols=subs(I.map(x=>x.m),sold);if(!sols.length)return;
    const outs=sols.map(sol=>{const set=new Set(sol);return I.filter((_,i)=>!set.has(i)).map(x=>+x.m.toFixed(2)).sort((a,b)=>a-b).join(',');});
    if(new Set(outs).size!==1)return; // عدة نتائج مختلفة → غير مؤكّد
    const set0=new Set(sols[0]),target=I.filter((_,i)=>!set0.has(i));
    if(!target.length)return;
    const cur=S.map(s=>+s.mizan.toFixed(2)).sort((a,b)=>a-b).join(', '),tgt=target.map(x=>+x.m.toFixed(2)).sort((a,b)=>a-b).join(', ');
    if(cur===tgt)return; // سليم أصلاً
    d.stock=d.stock.filter(s=>+s.qoubal!==q);
    const mkid=(typeof uid==='function')?uid:(()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
    target.forEach(x=>{const m=+x.m.toFixed(3),mt=x.meta||{};d.stock.push({id:mkid(),mizan:m,qoubal:q,w730:m*q/730,source:mt.source||'external',
      ...(mt.invId?{invId:mt.invId}:{}),...(mt.customerId?{customerId:mt.customerId}:{}),...(mt.price?{price:mt.price}:{}),date:Date.now()});});
    fixed++;
    (d.actLog=d.actLog||[]).push({at:Date.now(),k:'إصلاح',t:'تصحيح تقسيم سبائك عيار '+q+': '+cur+' ← '+tgt+' غ (نفس الوزن الإجمالي)'});
  });
  return fixed;
}
function incomingWeights(d){ // أوزان كل السبائك التي دخلت فعلاً [وزن، عيار]
  const W=[];(d.ingLog||[]).forEach(x=>W.push([+x.mizan,+x.qoubal]));
  (d.invoices||[]).filter(i=>i.type==='buy').forEach(i=>(i.rows||[]).forEach(r=>W.push([+r.mizan,+r.qoubal])));
  (d.cash||[]).filter(c=>c.cur==='730'&&c.kind==='pay'&&c.note!=='تسوية'&&+c.mizan>0).forEach(c=>W.push([+c.mizan,+c.qoubal]));
  return W;}
function cutParent(stock,m,q,inW){ // السبيكة التي قُصّ منها الوزن m: وزنها الحالي ليس وزناً أصلياً، ومع m يساوي وزن سبيكة دخلت — ويجب أن تكون واحدة فقط
  const isIn=w=>inW.some(x=>+x[1]===+q&&Math.abs(x[0]-w)<0.005);
  const c=stock.filter(s=>+s.qoubal===+q&&!isIn(s.mizan)&&isIn(s.mizan+m));
  return c.length===1?c[0]:null;}
function takeExact(qoubal,mizan){ // يُخرج سبيكة كاملة مطابقة (الأحدث) ويرجعها، أو null
  const ex=DB.stock.filter(s=>+s.qoubal===+qoubal&&Math.abs(s.mizan-mizan)<0.005).sort((a,b)=>(b.date||0)-(a.date||0))[0];
  if(ex)DB.stock=DB.stock.filter(s=>s!==ex);return ex||null;}
function takeFromStock(qoubal,mizan){ // يسحب وزناً من عيار معيّن، يرجع المسحوب فعلياً
  // أولاً: السبيكة المطابقة نفسها (نفس الوزن والعيار) — الأحدث — حتى لا تُقصّ سبيكة أخرى
  const ex=DB.stock.filter(s=>+s.qoubal===+qoubal&&Math.abs(s.mizan-mizan)<0.005).sort((a,b)=>(b.date||0)-(a.date||0))[0];
  if(ex){DB.stock=DB.stock.filter(s=>s!==ex);return mizan;}
  let rem=mizan;
  DB.stock.filter(s=>+s.qoubal===+qoubal).forEach(s=>{if(rem<=0)return;const t=Math.min(s.mizan,rem);s.mizan-=t;s.w730=w730of(s.mizan,s.qoubal);rem-=t;});
  DB.stock=DB.stock.filter(s=>s.mizan>0.0001);
  return mizan-rem;
}
function deleteInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id);if(!inv)return;
  if(inv.type==='buy'){const miss=buyIngotsMissing(inv);
    if(miss.length){alert('⚠️ لا يمكن حذف فاتورة الشراء N°'+inv.no+'\n\nسبائكها لم تعد في ذهب الكوفر (بِيعت أو سُلّفت أو عُدّلت):\n• '+miss.join('\n• ')+'\n\nاحذف أو عدّل البيع الذي أخرجها أولاً.');return;}}
  const c=DB.customers.find(x=>x.id===inv.customerId);
  const buy=inv.type==='buy';
  const lines=[
    `⚠️ حذف الفاتورة كاملة N°${inv.no}`,
    ``,
    `الزبون: ${c?c.name:'—'}`,
    `النوع: ${buy?'شراء':'بيع'} ${inv.settled?'خالص':'غير خالص'}`,
    `المبلغ: ${fmt(inv.money,0)} دج · ${fmt(inv.total730,2)} غ (730)`,
    ``,
    `سيحدث ما يلي:`,
    `• تُنقل الفاتورة إلى سلة المحذوفات (يمكن استرجاعها)`,
    `• ${buy?'تخرج سبائكها من ذهب الكوفر':'ترجع سبائكها إلى ذهب الكوفر'}`,
    inv.settled?`• ${buy?'يرجع':'يخرج'} مبلغ ${fmt(inv.money,0)} دج ${buy?'إلى':'من'} الكوفر`:`• يُلغى دين ${fmt(inv.money,0)} دج من دفتر الديون`,
    (inv.taken>0)?`• تُلغى حركة ${buy?'أخذ':'دفع'} ${fmt(inv.taken,0)} دج`:'',
    (buy&&inv.paid>0)?`• تُلغى حركة دفع ${fmt(inv.paid,0)} دج`:'',
    (buy&&lotUsed('L'+inv.id)>0.0005)?`• ⚠️ بِعت من ذهب هذه الفاتورة ${fmt(lotUsed('L'+inv.id),2)} غ — تُعاد فائدته بسعر الترباح أو تبقى بلا تكلفة`:'',
    ``,
    `هل تريد المتابعة؟`
  ].filter(x=>x!==null);
  if(!confirm(lines.join('\n')))return;
  toTrash('invoice',inv);
  if(buy)DB.trash[0].links=lotLinks(['L'+inv.id]);
  const note=reverseInvoiceEffects(inv);
  if(buy)detachLot('L'+inv.id);
  DB.invoices=DB.invoices.filter(x=>x.id!==inv.id);
  logAct('حذف','حذف '+invLogText(inv));save();closeModal();renderArchive();renderHome();renderDebts();
  toast(note?('حُذفت — '+note):('حُذفت الفاتورة N°'+inv.no+' — في سلة المحذوفات'));
}
function deleteCash(id){
  const cs=DB.cash.find(x=>x.id===id);if(!cs)return;
  const cu=DB.customers.find(x=>x.id===cs.customerId);
  const label=cs.cur==='730'?`${fmt(cs.mizan,2)}غ × ${cs.qoubal}`:`${fmt(cs.amount,0)} دج`;
  if(cs.cur==='730'&&cs.kind==='pay'&&!DB.stock.some(s=>+s.qoubal===+cs.qoubal&&Math.abs(s.mizan-cs.mizan)<0.005))
    return alert('⚠️ لا يمكن حذف هذه الحركة\n\nالسبيكة '+label+' لم تعد في ذهب الكوفر (بِيعت أو سُلّفت).\nاحذف أو عدّل البيع الذي أخرجها أولاً.');
  if(!confirm(`حذف حركة ${cs.kind==='pay'?'دفع':'أخذ'} (${label}${cu?' — '+cu.name:''})؟\nسيُعكس أثرها على الرصيد${cs.cur==='730'?' والمخزون':' والكوفر'}.\nتُنقل إلى سلة المحذوفات ويمكن استرجاعها.`))return;
  let note='',gotBack=null;
  if(cs.cur==='730'){
    if(cs.kind==='pay'){const got=takeFromStock(cs.qoubal,cs.mizan);gotBack=got;if(cs.mizan-got>0.001)note=`نقص ${fmt(cs.mizan-got,2)} غ من العيار ${cs.qoubal}`;}
    else if(cs.ingotSnap){const sn=JSON.parse(JSON.stringify(cs.ingotSnap));if(DB.stock.some(x=>x.id===sn.id))sn.id=uid();DB.stock.push(sn);} // السبيكة نفسها ترجع كما كانت
    else{const A=cutParent(DB.stock,+cs.mizan,+cs.qoubal,incomingWeights(DB)); // حركة قديمة قصّت من سبيكة: يرجع الوزن إلى سبيكته الأصلية
      if(A){A.mizan=+(A.mizan+(+cs.mizan)).toFixed(3);A.w730=w730of(A.mizan,A.qoubal);gotBack={mergedInto:A.id};}
      else DB.stock.push({id:uid(),mizan:cs.mizan,qoubal:cs.qoubal,w730:cs.amount,source:'external',customerId:cs.customerId,date:Date.now()});}
  }
  if(cs.invId){ // حركة تابعة لفاتورة: تُصفَّر خانتها في الفاتورة حتى تبقى مطابقة
    const inv=DB.invoices.find(x=>x.id===cs.invId);
    if(inv){if(inv.type==='buy'&&cs.kind==='pay')inv.paid=0; else inv.taken=0;}
  }
  toTrash('cash',{cs,gotBack});
  DB.cash=DB.cash.filter(x=>x.id!==id);logAct('حذف','حذف حركة '+(cs.kind==='pay'?'دفع':'أخذ')+' '+label+(cu?' — «'+cu.name+'»':''));save();
  closeModal();renderHome();renderDebts();
  toast(note?('حُذفت — '+note):'حُذفت الحركة — في سلة المحذوفات');
}

function toTrash(kind,data){

function trashInfo(t){
  const d=t.data,nm=id=>{const c=DB.customers.find(x=>x.id===id);return c?c.name:'—';};
  switch(t.kind){
    case 'invoice':{const b=d.type==='buy';return {badge:b?'فاتورة شراء':'فاتورة بيع',cls:b?'buy':'sell',title:nm(d.customerId),
      sub:`N°${d.no} · ${fmt(d.money,0)} دج · ${fmt(d.total730,2)} غ · ${d.settled?'خالص':'غير خالص'}`};}
    case 'cash':{const c=d.cs,p=c.kind==='pay',inv=c.invId?DB.invoices.find(x=>x.id===c.invId):null;
      return {badge:c.note==='سلف'?'سلف':(p?'دفع':'أخذ'),cls:c.note==='سلف'?'wd':(p?'pay':'take'),title:nm(c.customerId),
      sub:(c.cur==='730'?`${fmt(c.mizan,2)}غ × ${c.qoubal} = ${fmt(c.amount,2)} غ (730)`:`${fmt(c.amount,0)} دج`)+(inv?` · من فاتورة N°${inv.no}`:'')};}

    case 'adjust':{const p=[];if(Math.abs(+d.dinar||0)>0.5)p.push(`${d.dinar<0?'−':'+'} ${fmt(Math.abs(d.dinar),0)} دج`);
      if(Math.abs(+d.g730||0)>0.005)p.push(`${d.g730<0?'−':'+'} ${fmt(Math.abs(d.g730),2)} غ`);
      return {badge:'تعديل رصيد',cls:'wd',title:nm(d.customerId),sub:p.join(' · ')||'—'};}
    case 'expense':return {badge:'مصروف',cls:'exp',title:d.reason||'—',sub:`${fmt(d.amount,0)} دج`};
    case 'withdraw':return {badge:'سحب فائدة',cls:'wd',title:'من الفائدة',sub:`${fmt(d.amount,0)} دج`};
    case 'note':return {badge:'ترباح',cls:d.type==='sell'?'sell':'buy',title:d.name||'—',
      sub:`${d.type==='sell'?'بيع':'شراء'} ${fmt(d.weight,2)} غ × ${fmt(d.price,0)}`};
    case 'stockDel':return {badge:'سبيكة محذوفة',cls:'take',title:'ذهب الكوفر',sub:`${fmt(d.ing.mizan,2)}غ · عيار ${d.ing.qoubal}`};

function restoreTrash(id){
  const t=(DB.trash||[]).find(x=>x.id===id);if(!t)return;
  const d=t.data,err=m=>toast('تعذّر الاسترجاع — '+m);
  const qAvail=q=>DB.stock.filter(s=>+s.qoubal===+q).reduce((a,s)=>a+s.mizan,0);
  switch(t.kind){
    case 'invoice':{
      if(DB.invoices.some(x=>x.id===d.id))return err('الفاتورة موجودة');
      if(d.type==='sell'){const sh=stockShort(d.rows);if(sh.length)return err('سبائك غير موجودة في ذهب الكوفر: '+sh.join('، '));
        d.alloc=d.money>0?(allocFits(d.alloc)?d.alloc:(lotsAvail().length?autoAlloc(d.total730):[])):[];}
      COVER_OFF=true;DB.invoices.push(d);applyInvoiceEffects(d);COVER_OFF=false;
      if(d.type==='buy')reattach(t.links); // الاسترجاع يعيد الروابط كما كانت بالضبط — لا تغطية إضافية
      DB.counter=Math.max(DB.counter||0,+d.no||0);break;}
    case 'cash':{const c=d.cs;
      if(DB.cash.some(x=>x.id===c.id))return err('الحركة موجودة');
      if(c.invId){const inv=DB.invoices.find(x=>x.id===c.invId);
        if(!inv)return err('فاتورتها محذوفة — استرجع الفاتورة نفسها');
        const f=(inv.type==='buy'&&c.kind==='pay')?'paid':'taken';
        if((inv[f]||0)>0.0001)return err('الفاتورة فيها مبلغ آخر في هذه الخانة');
        inv[f]=c.amount;}
      if(c.cur==='730'){
        if(c.kind==='pay'){const m=d.gotBack!=null?d.gotBack:c.mizan;
          if(m>0.0001)DB.stock.push({id:uid(),mizan:m,qoubal:c.qoubal,w730:w730of(m,c.qoubal),source:'external',customerId:c.customerId,date:Date.now()});}
        else if(d.gotBack&&d.gotBack.mergedInto){const A=DB.stock.find(x=>x.id===d.gotBack.mergedInto);
          if(!A||A.mizan<+c.mizan-0.005)return err('السبيكة الأصلية لم تعد في ذهب الكوفر');
          A.mizan=+(A.mizan-c.mizan).toFixed(3);A.w730=w730of(A.mizan,A.qoubal);if(A.mizan<=0.0001)DB.stock=DB.stock.filter(x=>x!==A);}
        else{const byId=c.ingotSnap&&DB.stock.find(x=>x.id===c.ingotSnap.id&&Math.abs(x.mizan-c.mizan)<0.005);
          if(byId){DB.stock=DB.stock.filter(x=>x!==byId);c.ingotSnap=JSON.parse(JSON.stringify(byId));}
          else{const ex=takeExact(c.qoubal,c.mizan);if(!ex)return err('السبيكة '+fmt(c.mizan,2)+'غ × '+c.qoubal+' غير موجودة في ذهب الكوفر');
            if(c.ingotSnap)c.ingotSnap=JSON.parse(JSON.stringify(ex));}}
      }
      DB.cash.push(c);break;}
    case 'settle':
      if(d.cash.some(x=>DB.cash.some(y=>y.id===x.id)))return err('التسوية موجودة');
      (d.lots||[]).forEach(x=>DB.lots.push(x));
      d.cash.forEach(x=>{if(x.cur==='730'&&x.sType==='sell'&&(+x.sMoney||0)>0&&!allocFits(x.sAlloc))x.sAlloc=autoAlloc(+x.amount||0);DB.cash.push(x);});
      reattach(t.links);
      d.openings.forEach(x=>DB.openings.push(x));break;
    case 'adjust':
      if(DB.openings.some(x=>x.id===d.id))return err('التعديل موجود');DB.openings.push(d);break;
    case 'expense':
      if(d.amount>coffer()+0.001)return err('رصيد الكوفر '+fmt(coffer(),0)+' دج فقط');DB.expenses.push(d);break;
    case 'withdraw':{
      const p=profitCalc();
      if(d.amount>p.available+0.001)return err('الفائدة المتاحة '+fmt(Math.max(0,p.available),0)+' دج فقط');
      if(d.amount>coffer()+0.001)return err('رصيد الكوفر '+fmt(coffer(),0)+' دج فقط');
      DB.withdrawals.push(d);break;}
    case 'note':DB.notes.push(d);break;
    case 'stockDel':{const g=JSON.parse(JSON.stringify(d.ing));if(DB.stock.some(x=>x.id===g.id))g.id=uid();DB.stock.push(g);break;}
    case 'stockMerge':{const mp=DB.stock.find(x=>x.id===d.mergedId&&Math.abs(x.mizan-d.mizan)<0.01);
      if(!mp)return err('السبيكة المدموجة لم تعد كما كانت — تعذّر الفصل');
      DB.stock=DB.stock.filter(x=>x!==mp);
      d.parts.forEach(pp=>{const g=JSON.parse(JSON.stringify(pp));if(DB.stock.some(x=>x.id===g.id))g.id=uid();DB.stock.push(g);});break;}
    case 'stockSplit':{const a=DB.stock.find(x=>x.id===d.ids[0]&&Math.abs(x.mizan-d.m1)<0.01),b=DB.stock.find(x=>x.id===d.ids[1]&&Math.abs(x.mizan-d.m2)<0.01);
      if(!a||!b)return err('قطعتا التقسيم لم تعودا كما كانتا — تعذّر الدمج');
      DB.stock=DB.stock.filter(x=>x!==a&&x!==b);const g=JSON.parse(JSON.stringify(d.orig));if(DB.stock.some(x=>x.id===g.id))g.id=uid();DB.stock.push(g);break;}
  }
  DB.trash=DB.trash.filter(x=>x.id!==id);
  {const i=trashInfo(t);logAct('استرجاع','استرجاع من السلة: '+i.badge+' — '+i.title+' — '+i.sub);}save();renderHome();renderDebts();try{renderArchive();}catch(e){}
  openTrash();if(document.getElementById('stock-list'))try{openStock()}catch(e){}toast('استُرجع: '+trashInfo(t).badge);
}

function custBalanceAt(cid,before,skipSid){ // رصيد الزبون قبل لحظة معيّنة (بدون عملية التسوية نفسها)
  let dinar=0,g730=0;const ok=x=>(x.date||0)<before&&!(skipSid&&x.settleId===skipSid);
  DB.openings.filter(o=>o.customerId===cid&&ok(o)).forEach(o=>{dinar+=(+o.dinar||0);g730+=(+o.g730||0);});
  DB.invoices.filter(i=>i.customerId===cid&&ok(i)).forEach(inv=>{const sign=inv.type==='buy'?+1:-1;if(!inv.settled)dinar+=-sign*inv.money;});
  DB.cash.filter(c=>c.customerId===cid&&ok(c)).forEach(c=>{if(c.noBal)return;const s=c.kind==='pay'?-1:+1;if(c.cur==='730')g730+=s*c.amount;else dinar+=s*c.amount;});
  return {dinar,g730};
}
function settleDocs(){return DB.cash.filter(c=>c.note==='تسوية'&&c.cur==='730'&&c.settleId).map(c=>settleDoc(c.settleId)).filter(Boolean);}
function settleDoc(sid){
  const cs=DB.cash.find(c=>c.settleId===sid&&c.cur==='730'&&c.note==='تسوية');if(!cs)return null;
  const w=+cs.amount||0,money=+cs.sMoney||0,buy=cs.sType==='buy',p=w>0?money/w:0;
  const pb=custBalanceAt(cs.customerId,cs.date||0,sid);
  return {id:'S:'+sid,settleId:sid,isSettle:true,no:cs.sNo||'',customerId:cs.customerId,type:buy?'buy':'sell',settled:!!cs.sSettled,
    rows:[{mizan:w,qoubal:730,w730:w,price:p,total:money}],money,total730:w,taken:0,paid:0,
    prevBalance:pb.dinar,gPrev:pb.g730,gAfter:pb.g730+(buy?w:-w),date:cs.date||0};
}
const getDoc=id=>String(id).startsWith('S:')?settleDoc(String(id).slice(2)):DB.invoices.find(x=>x.id===id);

      <tr style="background:#fdf4d6"><td style="padding:12px;color:#b9820a">حساب الذهب بعد</td><td></td><td style="text-align:center;color:${inv.gAfter<-0.004?'#e33f57':(inv.gAfter>0.004?'#12a866':'#b9820a')}">${L(fmt(Math.abs(inv.gAfter),2))} غ ${Math.abs(inv.gAfter)<0.005?'خالص':(inv.gAfter<0?'له':'عليه')}</td></tr>`:''}</table></div>`;

/* ========= النسخ الاحتياطي التلقائي إلى الهاتف كل 8 ساعات ========= */
const BK='goldpro730_lastbackup';
function exportData(auto){
  if(!auto){logAct('إعدادات','تصدير نسخة احتياطية');save();}
  const payload={app:'GoldPro730',version:3,exportedAt:new Date().toISOString(),data:DB};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`goldpro-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  try{localStorage.setItem(BK,String(Date.now()));}catch(e){}
  toast(auto?'💾 نسخة احتياطية حُفظت في التنزيلات (كل 8 ساعات)':'تم تصدير نسخة من البيانات');

/* ========= الإرسال التلقائي عبر تيليجرام (كل ساعتين) ========= */
const TG_EVERY=2*60*60*1000;let TG_BUSY=false,TG_BUSY_AT=0;
const TGK='goldpro730_tg';
function tgGet(){try{return JSON.parse(localStorage.getItem(TGK))||{token:'',chat:'',on:false,last:0,err:''}}
  catch(e){return{token:'',chat:'',on:false,last:0,err:''}}}
function tgSet(o){try{localStorage.setItem(TGK,JSON.stringify(o))}catch(e){}}
function tgPayload(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`goldpro-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  const json=JSON.stringify({app:'GoldPro730',version:3,exportedAt:d.toISOString(),data:DB},null,2);
  return {name,blob:new Blob([json],{type:'application/json'})};
}
async function tgSend(auto){
  const t=tgGet();
  if(!t.token||!t.chat)return {ok:false,msg:'أكمل إعداد تيليجرام'};
  if(!navigator.onLine)return {ok:false,msg:'لا يوجد اتصال بالإنترنت'};
  const {name,blob}=tgPayload();
  const cap=`نسخة احتياطية — ${new Date().toLocaleString('ar')}\nزبائن: ${DB.customers.length} · فواتير: ${DB.invoices.length}`;
  const fd=new FormData();
  fd.append('chat_id',t.chat);fd.append('caption',cap);
  fd.append('document',blob,name);
  const ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(()=>{try{ctl&&ctl.abort()}catch(e){}},90000); // مهلة: لا ينتظر إلى الأبد
  t.try=Date.now();tgSet(t);
  try{
    const r=await fetch(`https://api.telegram.org/bot${t.token}/sendDocument`,{method:'POST',body:fd,signal:ctl?ctl.signal:undefined});
    clearTimeout(to);const j=await r.json();
    if(j.ok){t.last=Date.now();t.err='';tgSet(t);return {ok:true,msg:'أُرسلت النسخة إلى تيليجرام'};}
    t.err=j.description||'فشل الإرسال';tgSet(t);
    return {ok:false,msg:'تيليجرام: '+t.err};
  }catch(e){clearTimeout(to);t.err='تعذّر الاتصال';tgSet(t);return {ok:false,msg:'تعذّر الاتصال بتيليجرام'};}
}
async function tgDetect(){
  const tok=document.getElementById('tg-token').value.trim();
  if(!tok)return toast('أدخل رمز البوت أولاً');
  toast('جارٍ البحث...');
  try{
    const r=await fetch(`https://api.telegram.org/bot${tok}/getUpdates`);
    const j=await r.json();
    if(!j.ok)return toast('رمز البوت غير صحيح');
    const ids=[...new Set((j.result||[]).map(u=>u.message?.chat?.id).filter(Boolean))];
    if(!ids.length)return toast('أرسل رسالة للبوت أولاً ثم أعد المحاولة');
    document.getElementById('tg-chat').value=ids[ids.length-1];
    toast('تم العثور على المحادثة');
  }catch(e){toast('تعذّر الاتصال')}
}
function tgSaveCfg(){
  const t=tgGet();
  t.token=document.getElementById('tg-token').value.trim();
  t.chat=document.getElementById('tg-chat').value.trim();
  t.on=document.getElementById('tg-on').checked;
  tgSet(t);

async function tgSendNow(){
  const t=tgGet();
  t.token=document.getElementById('tg-token').value.trim();

  const r=await tgSend(false);toast(r.msg);if(r.ok)openBackup();
}
function tgCheckDaily(){
  const t=tgGet();
  if(!t.on||!t.token||!t.chat)return;
  if(!DB.customers.length&&!DB.invoices.length)return;
  if(Date.now()-(t.last||0)<TG_EVERY)return;
  if(TG_BUSY&&Date.now()-TG_BUSY_AT>3*60*1000)TG_BUSY=false; // حارس: لا يبقى «مشغولاً» للأبد
  if(TG_BUSY||(t.try&&Date.now()-t.try<2*60*1000))return; // لا نكرر المحاولة أسرع من دقيقتين
  TG_BUSY=true;TG_BUSY_AT=Date.now();
  setTimeout(async()=>{try{
    const cloud=window.GPCLOUD&&GPCLOUD.active&&GPCLOUD.claim;
    let c=null;
    if(cloud){ // السحابة: جهاز واحد فقط يرسل كل ساعتين لكل المحل
      c=await GPCLOUD.claim('tgLast',TG_EVERY);
      if(!c.ok){if(c.prev){const t2=tgGet();t2.last=Math.max(+t2.last||0,+c.prev);tgSet(t2);}return;}}
    const r=await tgSend(true);
    if(r.ok)toast('نسخة أُرسلت إلى تيليجرام');
    else if(cloud&&c)GPCLOUD.release('tgLast',c.prev); // فشل الإرسال: نحرّر الحجز ليحاول جهاز آخر
  }catch(e){}finally{TG_BUSY=false;}},1500);
}

        ${t.on?'<br><b style="color:#1a6ca8">الإرسال مفعّل حالياً.</b>':''}</div>

      <label style="display:block;font-size:11.5px;font-weight:800;color:#4d7ea8;margin:0 2px 6px">رمز البوت (Bot Token)</label>
      <input id="tg-token" value="${t.token}" placeholder="123456:ABC-DEF..." autocomplete="off"
        style="width:100%;padding:12px;border-radius:11px;border:1.5px solid #c3ddfa;background:#fff;font-size:13px;font-weight:700;outline:none;direction:ltr;margin-bottom:10px">

      <label style="display:block;font-size:11.5px;font-weight:800;color:#4d7ea8;margin:0 2px 6px">رقم المحادثة (Chat ID)</label>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="tg-chat" value="${t.chat}" placeholder="123456789" autocomplete="off"
          style="flex:1;min-width:0;padding:12px;border-radius:11px;border:1.5px solid #c3ddfa;background:#fff;font-size:14px;font-weight:800;outline:none;direction:ltr">
        <button onclick="tgDetect()" style="padding:12px 14px;border-radius:11px;background:#2aa3ef;color:#fff;font-weight:800;font-size:12.5px;white-space:nowrap">اكتشاف</button>
      </div>

      <label style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:13.5px;color:#1a6ca8;margin-bottom:13px;cursor:pointer">
        <input type="checkbox" id="tg-on" ${t.on?'checked':''} style="width:20px;height:20px;accent-color:#2aa3ef">
        تفعيل الإرسال التلقائي كل ساعتين</label>

      <div style="font-size:11.5px;font-weight:800;color:${t.err?'var(--red)':'#4d7ea8'};margin-bottom:12px">
        آخر إرسال: ${tgSince}${t.try&&t.try>(t.last||0)?('<br>آخر محاولة فاشلة: '+new Date(t.try).toLocaleString('ar')):''}${t.on&&t.last?('<br>الإرسال القادم: '+new Date(t.last+TG_EVERY).toLocaleString('ar')):''}${t.err?(' · خطأ: '+t.err):''}</div>

      <button onclick="tgSaveCfg()" style="width:100%;padding:13px;border-radius:12px;background:#1a6ca8;color:#fff;font-weight:800;font-size:14.5px;margin-bottom:9px">حفظ الإعداد</button>
      <button onclick="tgSendNow()" style="width:100%;padding:13px;border-radius:12px;background:#fff;border:1.5px solid #c3ddfa;color:#1a6ca8;font-weight:800;font-size:14px">إرسال تجريبي الآن</button>

      <div style="font-size:11px;color:#6f93b3;font-weight:700;line-height:1.9;margin-top:14px;border-top:1px solid #c3ddfa;padding-top:12px">
        <b>كيف تجهّزه (مرة واحدة):</b><br>
        1. افتح تيليجرام على هاتفك وابحث عن <b>@BotFather</b><br>
        2. أرسل له <b>/newbot</b> واختر اسماً للبوت<br>
        3. سيعطيك رمزاً — انسخه والصقه في خانة رمز البوت أعلاه<br>
        4. ابحث عن بوتك الجديد وأرسل له كلمة «مرحبا»<br>
        5. اضغط «اكتشاف» ليظهر رقم محادثتك<br>
        6. فعّل الإرسال ثم «حفظ الإعداد»<br><br>
        <b>النتيجة:</b> كل يوم تصلك نسخة من بياناتك في محادثتك مع بوتك. إن ضاع الجهاز أو تعطّل، حمّل آخر ملف من تيليجرام واستورده من زر «استيراد نسخة».
      </div>
    </div>`);
}

/* ========= ملء الشاشة (وضع سطح المكتب) ========= */
const FSK='goldpro730_fs';
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const isStandalone=()=>{try{
  return (window.matchMedia&&(window.matchMedia('(display-mode:fullscreen)').matches||window.matchMedia('(display-mode:standalone)').matches))||navigator.standalone===true;
}catch(e){return false}};
function enterFS(){const e=document.documentElement;
  (e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e).catch(()=>{});}
function exitFS(){(document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document).catch(()=>{});}
function toggleFS(){
  // في وضع kiosk (نافذة التطبيق المستقلة) زر ملء الشاشة يُغلق التطبيق
  if(isStandalone()||window.matchMedia('(display-mode:fullscreen)').matches){
    if(confirm('إغلاق التطبيق؟')){try{window.close()}catch(e){}}
    return;
  }
  if(isFS()){exitFS();try{localStorage.setItem(FSK,'0')}catch(e){}toast('خروج من ملء الشاشة');}
  else{enterFS();try{localStorage.setItem(FSK,'1')}catch(e){}}
  setTimeout(()=>{paintFSBtn();fitInvoiceIfOpen();},400);
}
function fitInvoiceIfOpen(){
  const pg=document.getElementById('page-invoice');
  if(pg&&!pg.classList.contains('hidden')&&INV&&INV.rows.every(r=>!String(r.mizan).trim()&&!String(r.qoubal).trim()))
    renderInvoiceForm();
}
/* ظهور لوحة المفاتيح يغيّر الارتفاع فقط: لا نعيد رسم الفاتورة وإلا ضاع الحقل الذي تكتب فيه واختفت اللوحة.
   نعيد الضبط فقط عند تغيّر العرض (تدوير الشاشة/تكبير النافذة) ولا حقل مُركَّز داخل الفاتورة */
let _rsz,_rszW=window.innerWidth;
window.addEventListener('resize',()=>{clearTimeout(_rsz);_rsz=setTimeout(()=>{
  const w=window.innerWidth;if(w===_rszW)return;_rszW=w;
  const a=document.activeElement,f=document.getElementById('invoice-form');
  if(a&&f&&f.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  fitInvoiceIfOpen();},250);});
function paintFSBtn(){
  const b=document.getElementById('fsbtn');if(!b)return;
  if(isStandalone()){b.style.display='none';return;}
  b.style.background=isFS()?'rgba(239,181,47,.16)':'rgba(255,255,255,.10)';
  b.style.color=isFS()?'#efb52f':'#aab2d0';
}
function autoFS(){ // المتصفح يشترط تفاعلاً من المستخدم، فنفعّلها عند أول ضغطة
  if(localStorage.getItem(FSK)!=='1'||isFS()||isStandalone())return;
  const once=()=>{enterFS();setTimeout(paintFSBtn,300);
    document.removeEventListener('pointerdown',once);document.removeEventListener('keydown',once);};
  document.addEventListener('pointerdown',once);document.addEventListener('keydown',once);
}
document.addEventListener('fullscreenchange',paintFSBtn);
document.addEventListener('webkitfullscreenchange',paintFSBtn);

/* ========= منع قائمة الزر الأيمن وحماية المصدر ========= */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if(e.key==='F12'){e.preventDefault();return;}
  if(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k)){e.preventDefault();return;}
  if(e.ctrlKey&&['u','s'].includes(k)){e.preventDefault();return;}
});
document.addEventListener('dragstart',e=>{if(e.target.tagName!=='INPUT')e.preventDefault();});
document.addEventListener('selectstart',e=>{
  const t=e.target.tagName;
  if(t!=='INPUT'&&t!=='TEXTAREA'&&t!=='SELECT')e.preventDefault();
});

/* ========= ساعة ========= */
function tick(){document.getElementById('clock').innerHTML='<b>'+new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})+'</b>'+new Date().toLocaleDateString('en-GB');}
function boot(){
  tick();setInterval(tick,20000);renderHome();checkAutoBackup();tgCheckDaily();
  setInterval(checkAutoBackup,30*60*1000);setInterval(tgCheckDaily,60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAutoBackup();tgCheckDaily();}});
  window.addEventListener('online',tgCheckDaily);
  paintFSBtn();autoFS();
}
(function(){const ov=document.createElement('div');ov.id='store-ov';
  ov.style.cssText='position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#0e1530;color:#efb52f;font:800 18px Cairo,Tahoma,sans-serif';
  ov.textContent='… جارٍ فتح البيانات';document.body.appendChild(ov);
  (window.GPCLOUD&&GPCLOUD.enabled?GPCLOUD.init():storeInit()).catch(e=>{try{console.error(e)}catch(_){}}).then(()=>{ov.remove();boot();storeWatch();verWatch();
    if(STORE_NOTE==='migrated')toast('📁 نُقلت بياناتك إلى ملف على القرص');
    if(STORE_NOTE==='newer-local')toast('📁 حُفظت آخر تعديلاتك في ملف البيانات');
    if(DB.fixP8||DB.fixP9||DB.fixP10){const n8=DB.fixP8||0,n9=(DB.fixP9||0)+(DB.fixP10||0);delete DB.fixP8;delete DB.fixP9;delete DB.fixP10;
      if(n8)logAct('إصلاح','دمج '+n8+' قطعة رجعت من حذف «أخذ» في سبائكها الأصلية');save();
      const L=[];if(n8)L.push('• '+n8+' قطعة رجعت من حذف «أخذ» — دُمجت في سبيكتها الأصلية');if(n9)L.push('• '+n9+' عيار صُحّح تقسيم سبائكه المشتّتة');
      setTimeout(()=>alert('✅ تصحيح ذهب الكوفر\n\n'+L.join('\n')+'\n\nالوزن الإجمالي للذهب لم يتغير. التفاصيل في سجل العمليات.'),900);}});})();
